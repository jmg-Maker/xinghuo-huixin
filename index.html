<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>星火回信 · 跨越时空的对话</title>
<style>
/* ============ 基础与变量 ============ */
:root{
  --bg-deep:#7C1414; --bg-deeper:#5c0e0e; --bg-mid:#8f1a1a;
  --paper:#F7F2E4; --paper-dim:#e9ddc2;
  --gold:#C8A060; --gold-hi:#E8C97A; --gold-dim:rgba(200,160,96,.45);
  --brown:#3A281C; --ink:#2c1c12; --seal:#d83c32;
  --font-display:"STKaiti","KaiTi","SimSun",serif;
  --font-body:"PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font-body); color:var(--brown);
  min-height:100vh; overflow-x:hidden;
  background:
    radial-gradient(1200px 620px at 18% -10%, rgba(232,201,122,.16), transparent 60%),
    radial-gradient(900px 520px at 88% 12%, rgba(255,255,255,.06), transparent 60%),
    radial-gradient(1000px 700px at 50% 110%, rgba(0,0,0,.35), transparent 70%),
    linear-gradient(180deg, var(--bg-mid) 0%, var(--bg-deep) 48%, var(--bg-deeper) 100%);
  background-attachment:fixed;
}
/* 宣纸纤维层：细微横纵纹理模拟纸张 */
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.5;
  background:
    repeating-linear-gradient(0deg, rgba(247,242,228,.015) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.02) 0 1px, transparent 1px 4px);
}
.paper-fiber{
  position:fixed; inset:0; z-index:1; pointer-events:none;
  background:
    radial-gradient(560px 400px at 30% 22%, rgba(232,201,122,.08), transparent 70%),
    radial-gradient(480px 360px at 76% 64%, rgba(255,255,255,.05), transparent 70%);
}
/* 星火粒子画布：层级最低、不拦截点击 */
#particles{position:fixed; inset:0; z-index:1; pointer-events:none}

/* ============ 应用容器与页面切换 ============ */
.app{position:relative; z-index:2; min-height:100vh; max-width:520px; margin:0 auto}
.screen{display:none; flex-direction:column; min-height:100vh; padding:1rem 1.1rem calc(1.6rem + env(safe-area-inset-bottom))}
.screen.active{display:flex; animation:fadeUp .5s ease both}
@keyframes fadeUp{from{opacity:0; transform:translateY(18px)} to{opacity:1; transform:none}}

/* 顶部通用返回条 */
.screen-head{display:flex; align-items:center; gap:.7rem; margin-bottom:.9rem; color:var(--gold-hi)}
.back-btn{
  width:2.2rem; height:2.2rem; flex:0 0 auto; border-radius:50%;
  border:1px solid var(--gold-dim); background:rgba(58,40,28,.25); color:var(--gold-hi);
  font-size:1.1rem; line-height:1; display:flex; align-items:center; justify-content:center;
}
.back-btn:active{transform:scale(.92)}
.screen-head h2{font-family:var(--font-display); font-size:1.35rem; letter-spacing:.12em}

/* 金边按钮 */
.btn{
  font-family:var(--font-body); border-radius:.55rem; border:1px solid var(--gold);
  background:transparent; color:var(--brown); padding:.6rem 1rem; font-size:.95rem;
  cursor:pointer; transition:transform .12s ease, box-shadow .12s ease; touch-action:manipulation;
}
.btn:active{transform:scale(.95)}
.btn.primary{background:linear-gradient(160deg, var(--gold-hi), var(--gold)); color:#3a2410; box-shadow:0 3px 10px rgba(0,0,0,.22)}
.btn.ghost{background:rgba(247,242,228,.92); border-color:var(--gold-dim)}
.btn.wide{width:100%; padding:.85rem; font-size:1.05rem; letter-spacing:.15em}
.btn[disabled]{opacity:.55; pointer-events:none}

/* ============ 首页：标题 + 三手机样机 ============ */
.home-hero{text-align:center; padding:1.5rem .5rem .4rem}
.poster-title{
  font-family:var(--font-display); font-weight:bold; color:var(--gold-hi);
  font-size:2.9rem; letter-spacing:.28em; text-shadow:0 2px 14px rgba(0,0,0,.4);
}
.poster-sub{margin-top:.5rem; color:var(--paper); font-family:var(--font-display); font-size:1.1rem; letter-spacing:.5em; opacity:.92}
.home-seal{
  display:inline-block; margin-top:.9rem; width:3.1rem; height:3.1rem; line-height:1;
  border:2px solid rgba(216,60,50,.9); color:#e8796f; border-radius:.4rem;
  font-family:var(--font-display); font-size:.95rem; font-weight:bold; padding:.28rem 0;
  transform:rotate(-8deg); letter-spacing:.05em; opacity:.9;
}
.phone-stack{display:flex; align-items:center; justify-content:center; gap:.55rem; padding:1.6rem .2rem .6rem}
.phone{
  position:relative; flex:0 0 auto; width:6.4rem; border-radius:1.1rem; cursor:pointer;
  background:linear-gradient(160deg,#3a2a1e,#1d130d); padding:.42rem; touch-action:manipulation;
  box-shadow:0 10px 26px rgba(0,0,0,.5), inset 0 0 0 1px rgba(232,201,122,.28);
  transition:transform .2s ease;
}
.phone:hover{transform:translateY(-3px)}
.phone:active{transform:scale(.96)}
.phone-main{width:9rem; transform:translateY(-.35rem); box-shadow:0 14px 30px rgba(0,0,0,.55), inset 0 0 0 1px rgba(232,201,122,.5)}
.phone-side.top{transform:translateY(.45rem)}
.phone-side.bot{transform:translateY(1.1rem)}
.phone-notch{width:2rem; height:.3rem; border-radius:.15rem; background:rgba(0,0,0,.65); margin:0 auto .35rem}
.phone-screen{background:var(--paper); border-radius:.75rem; overflow:hidden; height:11rem; position:relative; color:var(--ink); font-size:.52rem; padding:.5rem .55rem}
.phone-main .phone-screen{height:12.6rem}
.mock-num{
  position:absolute; top:-.55rem; left:50%; transform:translateX(-50%); z-index:3;
  background:var(--gold); color:#3a2410; font-weight:bold; font-size:.6rem; letter-spacing:.08em;
  border-radius:1rem; padding:.12rem .5rem; box-shadow:0 2px 6px rgba(0,0,0,.4);
}
.mock-title{display:block; font-family:var(--font-display); font-weight:bold; font-size:.68rem; margin-bottom:.4rem; color:var(--bg-deep)}
.mock-line{display:block; height:.34rem; background:rgba(58,40,28,.18); border-radius:.1rem; margin:.3rem 0}
.mock-line.short{width:62%}
.mock-btn{
  display:inline-block; margin-top:.45rem; padding:.18rem .6rem; border-radius:.3rem;
  background:linear-gradient(160deg,var(--gold-hi),var(--gold)); color:#3a2410; font-size:.52rem;
}
.mock-reply-title{display:block; font-family:var(--font-display); font-weight:bold; font-size:.66rem; color:var(--bg-deep); margin-bottom:.3rem}
.mock-text{line-height:1.5; color:rgba(44,28,18,.85)}
.mock-cursor{display:inline-block; width:.18rem; height:.62rem; background:var(--bg-deep); vertical-align:-.08rem; animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.mock-seal{
  position:absolute; right:.5rem; bottom:.5rem; width:1.7rem; height:1.7rem; border:1px solid var(--seal);
  color:var(--seal); font-family:var(--font-display); font-size:.5rem; border-radius:.2rem; display:flex;
  align-items:center; justify-content:center; transform:rotate(-10deg); opacity:.85;
}
.mock-card-body{position:absolute; inset:.5rem; border-radius:.5rem; background:linear-gradient(170deg,#8f1a1a,#5c0e0e); text-align:center; color:var(--gold-hi)}
.mock-card-avatar{
  display:flex; width:2.6rem; height:2.6rem; margin:.85rem auto .3rem; border-radius:50%;
  background:rgba(110,15,16,.85); border:1px solid var(--gold); align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:bold; font-size:1.1rem;
}
.mock-card-body b{display:block; font-family:var(--font-display); font-size:.68rem}
.mock-card-body i{font-style:normal; font-size:.5rem; color:rgba(232,201,122,.85)}
.home-hint{text-align:center; color:rgba(247,242,228,.8); font-size:.85rem; margin-top:.35rem; letter-spacing:.08em}
.ink-mountain{margin-top:1.1rem; text-align:center; opacity:.55; pointer-events:none}
.ink-mountain svg{width:88%; height:auto; display:inline-block}

/* ============ 先辈选择页 ============ */
.hero-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(15.2rem, 1fr)); gap:.9rem}
.hero-card{
  background:
    radial-gradient(220px 120px at 20% 0%, rgba(232,201,122,.12), transparent 70%),
    var(--paper);
  border-radius:.9rem; border:1px solid var(--gold-dim);
  padding:.9rem .85rem .85rem; box-shadow:0 6px 18px rgba(0,0,0,.35);
  display:flex; flex-direction:column; animation:fadeUp .55s ease both;
}
.hero-head{display:flex; align-items:center; gap:.7rem}
.hero-avatar{width:3.6rem; height:3.6rem; flex:0 0 auto; border-radius:50%}
.hero-id h3{font-family:var(--font-display); font-size:1.3rem; color:var(--bg-deep)}
.hero-years{font-size:.82rem; color:rgba(58,40,28,.75); margin-top:.1rem}
.hero-tags{margin:.6rem 0 .35rem; display:flex; flex-wrap:wrap; gap:.3rem}
.hero-tags span{
  font-size:.72rem; color:var(--brown); border:1px solid var(--gold-dim);
  border-radius:2rem; padding:.08rem .5rem; background:rgba(200,160,96,.14);
}
.hero-quote{font-family:var(--font-display); font-size:.88rem; line-height:1.6; color:rgba(58,40,28,.9); margin:.15rem 0 .5rem}
/* 固定高度滚动事迹框：仅内部滚动，整卡不滚动 */
.scroll-area{
  height:7.4rem; overflow-y:auto; padding:.35rem .5rem .1rem; border-left:2px solid var(--gold-dim);
  font-size:.8rem; line-height:1.75; color:rgba(58,40,28,.88); background:rgba(200,160,96,.06);
  border-radius:.3rem; margin-bottom:.7rem; -webkit-overflow-scrolling:touch;
}
.scroll-area p{margin-bottom:.4rem}
.scroll-area b{color:var(--bg-deep); font-weight:600}
.scroll-area::-webkit-scrollbar{width:4px}
.scroll-area::-webkit-scrollbar-thumb{background:var(--gold-dim); border-radius:2px}
.scroll-area::-webkit-scrollbar-track{background:transparent}
.card-actions{display:flex; gap:.55rem}
.card-actions .btn{flex:1; font-size:.88rem; padding:.52rem .4rem}

/* ============ 写信页 ============ */
.letter-paper{
  position:relative; background:var(--paper); border-radius:.9rem; border:1px solid var(--gold-dim);
  padding:1.1rem 1rem 1.2rem; box-shadow:0 8px 22px rgba(0,0,0,.35); flex:1; display:flex; flex-direction:column;
}
.letter-head{text-align:center; margin-bottom:.8rem; border-bottom:1px dashed var(--gold-dim); padding-bottom:.7rem}
.letter-head h2{font-family:var(--font-display); color:var(--bg-deep); font-size:1.5rem; letter-spacing:.08em}
.letter-head p{font-size:.8rem; color:rgba(58,40,28,.7); margin-top:.25rem; font-family:var(--font-display)}
.topic-grid{display:grid; grid-template-columns:1fr 1fr; gap:.5rem; margin-bottom:.7rem}
.topic-chip{
  border:1px solid var(--gold-dim); border-radius:.55rem; padding:.45rem .5rem; cursor:pointer;
  background:rgba(200,160,96,.08); transition:all .15s ease; touch-action:manipulation;
}
.topic-chip strong{display:block; font-size:.86rem; color:var(--brown)}
.topic-chip small{display:block; font-size:.66rem; color:rgba(58,40,28,.6); margin-top:.1rem; line-height:1.35}
.topic-chip.active{background:linear-gradient(160deg,var(--gold-hi),var(--gold)); border-color:var(--gold)}
.topic-chip.active strong,.topic-chip.active small{color:#3a2410}
#letter-text{
  flex:1; min-height:9.4rem; resize:none; border:1px solid var(--gold-dim); border-radius:.55rem;
  background:rgba(247,242,228,.6); font-family:var(--font-body); font-size:.95rem; line-height:1.8;
  padding:.7rem .8rem; color:var(--ink); outline:none;
}
#letter-text::placeholder{color:rgba(58,40,28,.4)}
#letter-sign{
  margin-top:.6rem; border:1px solid var(--gold-dim); border-radius:.55rem; padding:.6rem .8rem;
  font-size:.9rem; background:rgba(247,242,228,.6); color:var(--ink); outline:none; width:100%;
}
#letter-sign::placeholder{color:rgba(58,40,28,.4)}
.letter-decor{position:absolute; right:.9rem; bottom:6.2rem; pointer-events:none; opacity:.5; transform:rotate(8deg)}
.letter-decor .seal{
  display:flex; width:2.6rem; height:2.6rem; border:2px solid var(--seal); color:var(--seal);
  border-radius:.35rem; font-family:var(--font-display); font-weight:bold; font-size:.7rem;
  align-items:center; justify-content:center; line-height:1.25; letter-spacing:.04em; text-align:center;
}

/* ============ 回信页 ============ */
.reply-paper{
  background:
    radial-gradient(260px 120px at 85% 0%, rgba(232,201,122,.14), transparent 70%),
    var(--paper);
  border-radius:.9rem; border:1px solid var(--gold-dim); padding:1.1rem 1rem 1.2rem;
  box-shadow:0 8px 22px rgba(0,0,0,.35); flex:1; display:flex; flex-direction:column;
}
.reply-paper h2{font-family:var(--font-display); color:var(--bg-deep); font-size:1.4rem; text-align:center; letter-spacing:.1em}
.reply-paper .reply-sub{text-align:center; font-size:.78rem; color:rgba(58,40,28,.65); margin:.3rem 0 .8rem; font-family:var(--font-display)}
.reply-body{
  flex:1; overflow-y:auto; white-space:pre-wrap; word-break:break-word; line-height:1.95; font-size:.98rem;
  color:var(--ink); padding:.4rem .3rem; -webkit-overflow-scrolling:touch;
}
.reply-body::-webkit-scrollbar{width:4px}
.reply-body::-webkit-scrollbar-thumb{background:var(--gold-dim); border-radius:2px}
.cursor{display:inline-block; width:.16rem; height:1.05em; background:var(--bg-deep); vertical-align:-.15em; margin-left:.05rem; animation:blink 1s steps(1) infinite}
.reply-stamp{
  margin:0 auto; width:3rem; height:3rem; border:2px solid var(--seal); color:var(--seal);
  border-radius:.35rem; font-family:var(--font-display); font-weight:bold; font-size:.8rem;
  display:flex; align-items:center; justify-content:center; transform:rotate(-9deg);
  opacity:0; transition:opacity .8s ease; letter-spacing:.05em;
}
.reply-stamp.show{opacity:.85}
.reply-actions{display:flex; gap:.6rem; margin-top:.9rem}
.reply-actions .btn{flex:1}

/* ============ 纪念卡页 ============ */
.card-stage{flex:1; display:flex; align-items:center; justify-content:center; padding:.4rem 0}
#card-canvas{width:100%; max-width:21rem; border-radius:.7rem; box-shadow:0 10px 26px rgba(0,0,0,.45); background:#5c0e0e}
.card-actions{display:flex; gap:.6rem; margin-top:.9rem}
.card-actions .btn{flex:1}

/* ============ 详情弹层 ============ */
.modal{position:fixed; inset:0; z-index:60; display:none; align-items:flex-end; justify-content:center}
.modal.open{display:flex}
.modal-mask{position:absolute; inset:0; background:rgba(20,8,6,.72); backdrop-filter:blur(2px)}
.modal-card{
  position:relative; width:100%; max-width:520px; max-height:88vh; overflow-y:auto; border-radius:1.1rem 1.1rem 0 0;
  background:var(--paper); padding:1.1rem 1rem 1.3rem; animation:sheetUp .35s ease both;
  -webkit-overflow-scrolling:touch;
}
@keyframes sheetUp{from{transform:translateY(40px); opacity:.4} to{transform:none; opacity:1}}
.modal-head{display:flex; align-items:center; gap:.8rem}
.modal-head .hero-avatar{width:4rem; height:4rem}
.modal-name{font-family:var(--font-display); font-size:1.5rem; color:var(--bg-deep)}
.modal-years{font-size:.85rem; color:rgba(58,40,28,.7); margin-top:.1rem}
.modal-tags{margin-top:.35rem; display:flex; flex-wrap:wrap; gap:.3rem}
.modal-tags span{font-size:.7rem; border:1px solid var(--gold-dim); border-radius:2rem; padding:.06rem .45rem; color:var(--brown); background:rgba(200,160,96,.14)}
.modal-quote{margin:.7rem 0; font-family:var(--font-display); font-size:.95rem; line-height:1.7; color:rgba(58,40,28,.92); border-left:2px solid var(--gold); padding-left:.6rem}
.modal-relations{margin:.6rem 0}
.rel-item{display:flex; justify-content:space-between; font-size:.82rem; padding:.3rem .1rem; border-bottom:1px dashed rgba(200,160,96,.35); color:rgba(58,40,28,.85)}
.rel-item b{color:var(--bg-deep); font-weight:600}
.rel-item .rel-note{color:rgba(58,40,28,.55); font-size:.74rem; margin-top:.05rem; display:block}
.modal-actions{display:flex; gap:.6rem; margin-top:1rem}
.modal-actions .btn{flex:1}

/* ============ Toast ============ */
#toast{
  position:fixed; left:50%; bottom:12%; transform:translate(-50%, 12px); z-index:99;
  background:rgba(30,14,10,.92); color:var(--gold-hi); border:1px solid var(--gold-dim);
  padding:.6rem 1.1rem; border-radius:2rem; font-size:.86rem; max-width:82%; text-align:center;
  opacity:0; pointer-events:none; transition:opacity .3s ease, transform .3s ease;
}
#toast.show{opacity:1; transform:translate(-50%, 0)}

/* ============ 微信/移动端细节 ============ */
input,textarea,button{font-family:var(--font-body)}
@media (max-width:380px){
  .poster-title{font-size:2.4rem}
  .hero-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<canvas id="particles"></canvas>
<div class="paper-fiber"></div>

<div class="app" id="app">

  <!-- ================= 首页：三手机样机主视觉 ================= -->
  <section class="screen active" id="screen-home">
    <div class="home-hero">
      <h1 class="poster-title">星火回信</h1>
      <p class="poster-sub">跨越时空的对话</p>
      <span class="home-seal">星火<br>回信</span>
    </div>

    <div class="phone-stack">
      <!-- 01 写信样机 -->
      <div class="phone phone-side top" data-goto="heroes">
        <span class="mock-num">01 写信</span>
        <div class="phone-notch"></div>
        <div class="phone-screen">
          <div class="mock-letter">
            <span class="mock-title">致 李大钊 先生</span>
            <span class="mock-line"></span>
            <span class="mock-line"></span>
            <span class="mock-line short"></span>
            <span class="mock-btn">寄出这封信</span>
          </div>
          <span class="mock-seal">星火</span>
        </div>
      </div>
      <!-- 02 回信样机（主视觉居中） -->
      <div class="phone phone-main" data-goto="heroes">
        <span class="mock-num">02 回信</span>
        <div class="phone-notch"></div>
        <div class="phone-screen">
          <div class="mock-reply">
            <span class="mock-reply-title">李大钊 的回信</span>
            <p class="mock-text">青年诸君：你的来信我读过了。青春之人，当有青春之精神……</p>
            <span class="mock-cursor"></span>
          </div>
          <span class="mock-seal">回信</span>
        </div>
      </div>
      <!-- 03 纪念卡样机 -->
      <div class="phone phone-side bot" data-goto="heroes">
        <span class="mock-num">03 纪念卡</span>
        <div class="phone-notch"></div>
        <div class="phone-screen">
          <div class="mock-card-body">
            <span class="mock-card-avatar">李</span>
            <b>李大钊</b>
            <i>1889—1927</i>
            <span class="mock-seal">星火回信</span>
          </div>
        </div>
      </div>
    </div>
    <p class="home-hint">点击样机，提笔写信给心中的先辈</p>

    <div class="ink-mountain">
      <svg viewBox="0 0 300 90" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax meet">
        <path d="M0 90 L0 62 Q38 40 78 58 Q110 34 150 52 Q192 28 228 46 Q268 36 300 52 L300 90 Z" fill="rgba(0,0,0,.28)"/>
        <path d="M0 90 L0 74 Q46 58 96 72 Q150 56 210 70 Q266 62 300 74 L300 90 Z" fill="rgba(0,0,0,.2)"/>
        <path d="M120 58 Q140 30 168 30 Q196 30 214 54 Q196 44 168 46 Q142 46 120 58 Z" fill="rgba(232,201,122,.16)"/>
      </svg>
    </div>
  </section>

  <!-- ================= 先辈选择页 ================= -->
  <section class="screen" id="screen-heroes">
    <header class="screen-head">
      <button type="button" class="back-btn" data-goto="home">‹</button>
      <h2>选择一位先辈</h2>
    </header>
    <div class="hero-grid" id="hero-grid"></div>
  </section>

  <!-- ================= 写信页 ================= -->
  <section class="screen" id="screen-letter">
    <header class="screen-head">
      <button type="button" class="back-btn" data-goto="heroes">‹</button>
      <h2>提笔写信</h2>
    </header>
    <div class="letter-paper">
      <div class="letter-head">
        <h2 id="letter-title">给先辈的信</h2>
        <p id="letter-sub">见字如面</p>
      </div>
      <div class="topic-grid" id="topic-grid"></div>
      <textarea id="letter-text" placeholder="写下你想对先辈说的话……（回信会引用你的开头）"></textarea>
      <input id="letter-sign" type="text" maxlength="20" placeholder="落款（可选，默认：一个当代青年）">
      <div class="letter-decor"><span class="seal">星火<br>回信</span></div>
      <button type="button" id="btn-send" class="btn primary wide">寄出这封信</button>
    </div>
  </section>

  <!-- ================= AI回信页 ================= -->
  <section class="screen" id="screen-reply">
    <header class="screen-head">
      <button type="button" class="back-btn" data-goto="heroes">‹</button>
      <h2 id="reply-title">先辈 的回信</h2>
    </header>
    <div class="reply-paper">
      <p class="reply-sub" id="reply-sub">来自时空的嘱托</p>
      <div class="reply-body" id="reply-body"><span class="cursor"></span></div>

开，避免具体政治表述。"},"unfinished_wish":{"label":"您未竟的心愿","guide":"问问她未竟的心愿，特别是对孩子的牵挂。","redline":"不得虚构遗愿；仅可基于《托孤遗书》等史料精神作答，不得编造其子后续经历。"},"my_confusion":{"label":"我的迷茫时刻","guide":"倾诉当下的迷茫与困惑，听听这位钢铁母亲的答复。","redline":"不编造史实；以意志、温情与希望为核心回应，不作政治评价。"}},"relations":[{"name":"彭咏梧","relation":"丈夫","note":"革命伴侣，共同战斗于川东地下党","group":"family"},{"name":"彭云","relation":"儿子","note":"狱中写下'托孤信'，嘱托抚养成人","group":"family"},{"name":"谭竹安","relation":"托孤人","note":"狱中书信托付彭云抚养事宜","group":"comrade"},{"name":"许晓轩","relation":"狱友","note":"渣滓洞狱中坚贞不屈的战友","group":"comrade"}]},{"id":"zhaoyiman","name":"赵一曼","years":"1905—1936","tags":["抗日民族女英雄","东北抗日联军政委","《示儿书》作者"],"bio":"赵一曼（1905—1936），原名李坤泰，四川宜宾人，著名抗日民族女英雄，东北抗日联军第三军二团政委。1935年11月在战斗中受伤被俘，受尽酷刑坚贞不屈，1936年8月2日在珠河县（今尚志市）英勇就义。就义前给儿子宁儿写下感人至深的《示儿书》，时年31岁。","quotes":["母亲不用千言万语来教育你，就用实行来教育你。","在你长大成人之后，希望不要忘记你的母亲是为国而牺牲的！","誓志为人不为家，涉江渡海走天涯。","未惜头颅新故国，甘将热血沃中华。"],"portrait":"assets/heroes/zhaoyiman.png","style_hint":"母亲视角与战士气概交织：家书深情、字字千钧，对孩子温柔而坚定，对信仰从容无悔；可用'孩子'称呼年轻用户，落款可署'你的母亲赵一曼'。","topics":{"today_china":{"label":"今天的中国","guide":"你想告诉赵一曼阿姨今天的中国——她以热血浇灌的中华。","redline":"不得虚构其经历；'甘将热血沃中华'可与当代中国呼应，但不得编造史实细节或具体数据。"},"my_ideal":{"label":"我的理想","guide":"分享你的理想与追求，听听这位母亲的答复。","redline":"不虚构生平；回应围绕爱、勇敢与责任展开，避免具体政治表述。"},"unfinished_wish":{"label":"您未竟的心愿","guide":"问问他未竟的心愿，特别是对孩子的牵挂。","redline":"不得虚构遗愿；仅可基于《示儿书》精神作答，不得编造其子后续经历。"},"my_confusion":{"label":"我的迷茫时刻","guide":"倾诉当下的迷茫与困惑，听听这位母亲的答复。","redline":"不编造史实；以坚韧、母爱与家国情怀为核心回应，不作政治评价。"}},"biography":{"early":"1905年生于四川宜宾白杨嘴村，原名李坤泰。1924年加入中国社会主义青年团，1926年入武汉中央军事政治学校（黄埔军校武汉分校）学习，同年加入中国共产党，1927年赴苏联莫斯科中山大学学习，次年回国。","revolution":"九一八事变后受党派遣赴东北，历任中共满洲省委妇女委员、哈尔滨总工会代理书记，参与领导电车工人大罢工。1935年任东北抗日联军第三军二团政委，率部转战珠河一带，被日伪称为'密林女王'。","sacrifice":"1935年11月在战斗中为掩护部队负伤被俘。受尽酷刑坚贞不屈，1936年8月2日被押往珠河县（今尚志市）游街示众后英勇就义。临刑前给儿子宁儿写下《示儿书》：'母亲不用千言万语来教育你，就用实行来教育你。'时年31岁。","legacy":"《示儿书》成为红色家书经典，感动无数后人；哈尔滨一曼街、宜宾赵一曼纪念馆、尚志市等地以其命名纪念；'未惜头颅新故国，甘将热血沃中华'被广为传颂。"},"relations":[{"name":"陈达邦","relation":"丈夫","note":"留苏同学，革命伴侣","group":"family"},{"name":"陈掖贤","relation":"儿子","note":"乳名宁儿，牺牲前遗书深情嘱托","group":"family"},{"name":"赵尚志","relation":"战友","note":"东北抗联第三军并肩战斗","group":"comrade"}]},{"id":"yangjingyu","name":"杨靖宇","years":"1905—1940","tags":["东北抗联第一路军总司令","河南确山人","民族英雄"],"bio":"杨靖宇（1905—1940），原名马尚德，河南确山人，著名抗日民族英雄，东北抗日联军第一路军总司令。1932年受命赴东北组织抗日武装，长期转战白山黑水间。1940年2月在濛江县（今靖宇县）率部与敌周旋数日后壮烈牺牲，时年35岁。敌人剖开他的腹部，发现胃里只有草根、树皮和棉絮。","quotes":["头颅可断腹可剖，烈忾难消志不磨。","革命就像火一样，任凭大雪封山，鸟兽藏迹，只要我们有火种，就能驱赶严寒，带来光明和温暖。","老乡，我们中国人都投降了，还有中国吗？","任凭敌人使尽一切手段，我也决不投降。"],"portrait":"assets/heroes/yangjingyu.png","style_hint":"抗联将领口吻：坚毅沉雄、话语朴实而滚烫；善用火、雪、山林等意象，谈信仰时刚硬如铁；对青年如对战友，平等而热切；落款可署'靖宇'。","biography":{"early":"1905年生于河南确山李湾村农家，原名马尚德。少年时目睹军阀混战与农民疾苦，1923年入开封纺织工业学校，开始接触进步思想。1927年加入中国共产党，随即领导确山农民暴动，参与创建确山县农民革命军。","revolution":"1929年受党派遣赴东北，化名杨靖宇，先后任中共抚顺特别支部书记、东北反日救国会总会长，在煤矿工人中发展组织。1932年组建南满游击队，1936年任东北抗日联军第一路军总司令，率部转战长白山、濛江、辑安等地，以游击战牵制大批日军，威震南满。","sacrifice":"1940年初因叛徒出卖，部队陷入重围。他率少量部队与敌周旋五昼夜，弹尽粮绝，只以草根、树皮、棉絮充饥。2月23日在濛江县三道崴子被敌包围，孤身奋战壮烈牺牲，时年35岁。日军剖腹查验，发现其胃中只有草根、树皮与棉絮，为之震惊。","legacy":"1946年濛江县更名为靖宇县，以示纪念。哈尔滨建有杨靖宇将军纪念馆，靖宇县杨靖宇殉国地成为重要爱国主义教育基地。他以草根棉絮为食、战斗到最后一刻的事迹，成为中华民族不屈精神的象征。"},"topics":{"today_china":{"label":"今天的中国","guide":"你想告诉杨靖宇将军今天的中国——白山黑水已是锦绣山河。","redline":"不得虚构其经历；东北抗战与今日中国发展可作精神呼应，但不得编造具体数字或未发生事件。"},"my_ideal":{"label":"我的理想","guide":"分享你的理想与追求，听听这位抗联将领的答复。","redline":"不虚构生平；回应围绕信念、坚持与家国情怀展开，避免具体政治表述。"},"unfinished_wish":{"label":"您未竟的心愿","guide":"问问他未竟的心愿，以及今天的我们如何接力。","redline":"不得虚构遗愿；仅可基于其抗日救国、民族解放的信念作答。"},"my_confusion":{"label":"我的迷茫时刻","guide":"倾诉当下的迷茫与困惑，听听这位铁骨将军的答复。","redline":"不编造史实；以坚韧、火种与光明为核心回应，不作政治评价。"}},"relations":[{"name":"郭莲","relation":"妻子","note":"原配妻子，在家乡含辛茹苦支持革命","group":"family"},{"name":"魏拯民","relation":"战友","note":"东北抗联第一路军政委，生死搭档","group":"comrade"},{"name":"马尚德","relation":"本名","note":"杨靖宇为其化名，取'靖宇'寓意安定寰宇","group":"comrade"}]},{"id":"xiaminghan","name":"夏明翰","years":"1900—1928","tags":["就义诗作者","湖南衡阳人","砍头不要紧只要主义真"],"bio":"夏明翰（1900—1928），湖南衡阳人，无产阶级革命家、诗人。1921年经毛泽东介绍加入中国共产党，曾任中共湖南省委委员、中共湖北省委常委。1928年3月20日在汉口英勇就义，临刑前写下就义诗：'砍头不要紧，只要主义真。杀了夏明翰，还有后来人。'时年28岁。","quotes":["砍头不要紧，只要主义真。杀了夏明翰，还有后来人。","人贵自立，学贵自强。","只要认清了真理，就要为之奋斗到底。","我以我血荐轩辕，后来人自会续新篇。"],"portrait":"assets/heroes/xiaminghan.png","style_hint":"革命诗人口吻：热血、理想主义、诗句般的语言；谈信仰铿锵有力，谈青年满怀期许；可用'同志''青年朋友'称呼；落款可署'明翰'。","biography":{"early":"1900年生于湖南衡阳一个书香门第，祖父为晚清进士。少年时受新思想启蒙，厌恶封建礼教，曾因剪掉辫子、反对包办婚姻与家庭决裂。1917年考入湖南省立第三师范学校，积极参加爱国学生运动，任学联负责人。","revolution":"1921年经毛泽东、何叔衡介绍加入中国共产党，任中共湖南省委委员兼组织部部长，参与领导湖南农民运动，创办《湖南学生联合会周刊》。1927年大革命失败后转战湘鄂，1928年初任中共湖北省委常委，在白色恐怖中负责恢复省委组织、开展秘密斗争。","sacrifice":"1928年3月18日，因叛徒出卖在汉口被捕。狱中坚贞不屈，3月20日临刑前写下气壮山河的就义诗：'砍头不要紧，只要主义真。杀了夏明翰，还有后来人。'随后从容就义，年仅28岁。","legacy":"就义诗成为革命者理想信念的经典表达，激励无数后来人。武汉、衡阳等地建有夏明翰烈士纪念设施，其故居（湖南衡阳）是爱国主义教育基地，'砍头不要紧，只要主义真'被一代代青年传诵。"},"topics":{"today_china":{"label":"今天的中国","guide":"你想告诉夏明翰今天的中国——他诗中'后来人'已把中国建成理想模样。","redline":"不得虚构其经历；'后来人'意象与当代中国发展可作呼应，但不得编造具体数字或未发生事件。"},"my_ideal":{"label":"我的理想","guide":"分享你的理想与追求，听听这位革命诗人的答复。","redline":"不虚构生平；回应围绕主义、真理与热血理想展开，避免具体政治表述。"},"unfinished_wish":{"label":"您未竟的心愿","guide":"问问他未竟的心愿，以及今天的我们如何接力。","redline":"不得虚构遗愿；仅可基于就义诗与革命信念作答。"},"my_confusion":{"label":"我的迷茫时刻","guide":"倾诉当下的迷茫与困惑，听听这位革命诗人的答复。","redline":"不编造史实；以真理、热血与后来人信念为核心回应，不作政治评价。"}},"relations":[{"name":"郑家钧","relation":"妻子","note":"革命伴侣，《就义诗》即为诀别遗言","group":"family"},{"name":"夏明震","relation":"兄长","note":"湘南起义领导人之一，先于其壮烈牺牲","group":"family"},{"name":"毛泽东","relation":"入党介绍人","note":"1921 年经毛泽东、何叔衡介绍加入中国共产党","group":"mentor"}]},{"id":"leifeng","name":"雷锋","years":"1940—1962","tags":["共产主义战士","《雷锋日记》作者","全国学雷锋榜样"],"bio":"雷锋（1940—1962），湖南望城人，伟大的共产主义战士。1957年加入共青团，1960年参军并加入中国共产党。甘当'革命螺丝钉'，助人为乐、勤俭节约，1962年8月15日因公殉职，年仅22岁。毛泽东题词'向雷锋同志学习'，3月5日成为全国学雷锋纪念日。","quotes":["人的生命是有限的，可是为人民服务是无限的，我要把有限的生命投入到无限的为人民服务之中去。","对待同志要像春天般的温暖，对待工作要像夏天一样火热。","我愿做一颗永不生锈的螺丝钉。"],"portrait":"assets/heroes/leifeng.png","style_hint":"日记体：语气朴实温暖，善用'同志''群众''党'等词；爱用比喻（螺丝钉、春风）；自我勉励与助人为乐并重；落款可署名'雷锋'。","topics":{"today_china":{"label":"今天的中国","guide":"你想向雷锋讲述今天的中国——志愿服务、身边好人、新时代的雷锋精神如何延续……","redline":"不得虚构其生前经历；志愿服务常态化、学雷锋活动延续属公认社会事实，可自然接续，但不得编造具体数字或未发生事件。"},"my_ideal":{"label":"我的理想","guide":"分享你的理想与追求，听听雷锋如何看待平凡岗位上的伟大。","redline":"不虚构其生平细节；回应聚焦为人民服务、螺丝钉精神，避免具体政治表述。"},"unfinished_wish":{"label":"您未竟的心愿","guide":"问问他未竟的心愿，以及今天的我们如何接力。","redline":"不得虚构其遗愿内容，仅可基于《雷锋日记》与生前书信精神作答。"},"my_confusion":{"label":"我的迷茫时刻","guide":"倾诉当下的迷茫与困惑，听听雷锋的答复。","redline":"不编造史实；以奉献、乐观、坚持为核心回应，不作政治评价。"}},"biography":{"early":"1940年12月18日生于湖南长沙望城一户贫苦农民家庭，原名雷正兴。7岁沦为孤儿，在乡亲帮助和党的关怀下成长，1950年入小学读书，1956年高小毕业，先后在乡政府、县委当通信员和公务员。","revolution":"1957年加入中国新民主主义青年团，参加根治沩水工程和团山湖农场建设。1958年到辽宁鞍钢当推土机手，多次被评为先进生产者。1960年1月参军，编入沈阳军区工程兵某部运输连，同年11月加入中国共产党，荣立二等功一次、三等功两次，被评为'节约标兵''模范共青团员'。","sacrifice":"1962年8月15日，雷锋与战友在抚顺执行任务时，被倒车时碰倒的木杆砸中头部，因公殉职，年仅22岁。牺牲前他留下了数十万字日记和大量助人为乐的事迹，被誉为'毫不利己、专门利人'的典范。","legacy":"1963年3月5日，毛泽东题词'向雷锋同志学习'，全国掀起学雷锋热潮。此后每年3月5日定为学雷锋纪念日，'雷锋精神'成为中国共产党人精神谱系的重要组成部分，学雷锋志愿服务至今遍及全国城乡。"},"relations":[{"name":"毛泽东","relation":"题词者","note":"1963年为雷锋题词'向雷锋同志学习'","group":"精神传承"},{"name":"乔安山","relation":"生前战友","note":"雷锋同班战友，共同执行1962年8月15日任务","group":"战友情谊"},{"name":"张思德","relation":"精神同源","note":"同为'为人民服务'典范，毛泽东作《为人民服务》纪念","group":"精神传承"}]},{"id":"dongcunrui","name":"董存瑞","years":"1929—1948","tags":["全国战斗英雄","舍身炸碉堡","隆化战斗"],"bio":"董存瑞（1929—1948），河北怀来人，人民解放军著名战斗英雄。1945年参军，1947年加入中国共产党。1948年5月25日在隆化战斗中，为扫除部队前进障碍，手托炸药包舍身炸毁敌桥形暗堡，壮烈牺牲，年仅19岁。朱德题词'舍身为国，永垂不朽'。","quotes":["为了新中国，冲啊！","完成任务，消灭敌人，就是最大的幸福。"],"portrait":"assets/heroes/dongcunrui.png","style_hint":"战士体：语气刚毅果敢，善用'任务''胜利''战友''连队'等军语；信念坚定、行动力强；落款可署名'存瑞'。","topics":{"today_china":{"label":"今天的中国","guide":"你想向董存瑞讲述今天的中国——和平年代、强军建设、隆化中学的孩子们……","redline":"不得虚构其生前经历；隆化战斗遗址、隆化中学纪念属公认史实，可自然接续，但不得编造具体数字或未发生事件。"},"my_ideal":{"label":"我的理想","guide":"分享你的理想与追求，听听英雄如何看待使命与担当。","redline":"不虚构其生平细节；回应聚焦忠诚、勇毅、为集体献身，避免具体政治表述。"},"unfinished_wish":{"label":"您未竟的心愿","guide":"问问他未竟的心愿，以及今天的我们如何接力。","redline":"不得虚构其遗愿内容，仅可基于战斗英雄的集体信念作答。"},"my_confusion":{"label":"我的迷茫时刻","guide":"倾诉当下的迷茫与困惑，听听英雄的答复。","redline":"不编造史实；以坚定、勇敢、团结为核心回应，不作政治评价。"}},"biography":{"early":"1929年10月15日生于河北怀来南山堡村一个贫苦农民家庭，乳名四虎子。幼年家贫，只读过几年书便辍学务农，1943年参加抗日儿童团并任儿童团长，站岗放哨、送信带路。","revolution":"1945年7月参加八路军，1947年3月加入中国共产党。作战勇敢机智，先后立大功三次、小功四次，获三枚勇敢奖章和一枚毛泽东奖章，1948年任东北人民解放军某部六班班长，被称为'爆破大王'。","sacrifice":"1948年5月25日，隆化战斗打响。部队进攻隆化中学时被敌桥型暗堡火力压制，董存瑞主动请缨爆破。因无处安放炸药包，他毅然手托炸药包抵住桥底，拉燃导火索，高呼'为了新中国，冲啊'，与暗堡同归于尽，壮烈牺牲，年仅19岁。","legacy":"1950年追认董存瑞为全国战斗英雄。朱德题词'舍身为国，永垂不朽'；隆化中学改称存瑞中学，怀来县建有董存瑞纪念馆，'董存瑞精神'鼓舞着一代代青年勇敢担当。"},"relations":[{"name":"朱德","relation":"题词者","note":"为董存瑞题词'舍身为国，永垂不朽'","group":"精神传承"},{"name":"郅顺义","relation":"生前战友","note":"隆化战斗中的战友，亲眼见证董存瑞舍身炸碉堡","group":"战友情谊"}]},{"id":"huangjiguang","name":"黄继光","years":"1931—1952","tags":["特级战斗英雄","抗美援朝","上甘岭战役"],"bio":"黄继光（1931—1952），四川中江人，中国人民志愿军特级战斗英雄。1951年参加抗美援朝，1952年10月在上甘岭战役中，为掩护部队夺取高地，毅然用胸膛堵住敌人机枪射孔，壮烈牺牲，年仅21岁。志愿军总部追记特等功，授予'特级英雄'称号。","quotes":["不立功不下战场。","请祖国和人民放心，我们一定完成任务。"],"portrait":"assets/heroes/huangjiguang.png","style_hint":"志愿军战士体：语气热血坚定，善用'祖国''人民''阵地''战友'等词；家书式表达真挚亲切；落款可署名'继光'。","topics":{"today_china":{"label":"今天的中国","guide":"你想向黄继光讲述今天的中国——盛世如愿、山河无恙、中江故里的新貌……","redline":"不得虚构其生前经历；上甘岭战役纪念、中江黄继光纪念馆属公认史实，可自然接续，但不得编造具体数字或未发生事件。"},"my_ideal":{"label":"我的理想","guide":"分享你的理想与追求，听听英雄如何看待祖国需要与个人选择。","redline":"不虚构其生平细节；回应聚焦忠诚、无畏、挺身而出，避免具体政治表述。"},"unfinished_wish":{"label":"您未竟的心愿","guide":"问问他未竟的心愿，以及今天的我们如何接力。","redline":"不得虚构其遗愿内容，仅可基于抗美援朝保家卫国的集体信念作答。"},"my_confusion":{"label":"我的迷茫时刻","guide":"倾诉当下的迷茫与困惑，听听英雄的答复。","redline":"不编造史实；以勇敢、坚定、奉献为核心回应，不作政治评价。"}},"biography":{"early":"1931年生于四川中江一个贫苦农民家庭，排行第三。幼年丧父，11岁起给地主扛长活，饱受剥削。1949年家乡解放后积极参加清匪反霸斗争，曾任村农会委员。","revolution":"1951年3月参加中国人民志愿军，随部队赴朝作战，编入第15军第135团。入伍后刻苦训练，被评为模范战士。1952年4月加入中国新民主主义青年团，后随部参加五圣山前沿阵地防御作战。","sacrifice":"1952年10月19日晚，上甘岭战役中，黄继光所在营奉命夺取597.9高地。部队遭敌火力压制，他主动请战，在战友相继牺牲、自身多处负伤的情况下，毅然跃起用胸膛堵住敌人机枪射孔，为部队打开冲锋道路，壮烈牺牲，年仅21岁。","legacy":"1953年志愿军总部追记特等功，追授'特级战斗英雄'称号；朝鲜授予'朝鲜民主主义人民共和国英雄'称号。中江建有黄继光纪念馆，上甘岭精神与黄继光英雄事迹成为一代代中国青年的精神坐标。"},"relations":[{"name":"邱少云","relation":"同军战友","note":"同属志愿军第15军，先后在朝鲜战场上壮烈牺牲","group":"战友情谊"},{"name":"王清珍","relation":"后方卫生员","note":"上甘岭战役中护理伤员的志愿军卫生员，见证英雄事迹","group":"战友情谊"}]},{"id":"qiushaoyun","name":"邱少云","years":"1926—1952","tags":["一级战斗英雄","抗美援朝","烈火中坚守纪律"],"bio":"邱少云（1926—1952），四川铜梁（今属重庆）人，中国人民志愿军一级战斗英雄。1951年参加抗美援朝。1952年10月12日在执行潜伏任务时，被敌人燃烧弹引燃衣物，为不暴露部队目标，强忍剧痛纹丝不动，直至壮烈牺牲，年仅26岁。","quotes":["为了整体，为了胜利，严守潜伏纪律。","祖国需要我们守纪律，再痛我也要挺住。"],"portrait":"assets/heroes/qiushaoyun.png","style_hint":"志愿军战士体：语气沉稳坚毅，善用'纪律''整体''胜利''阵地'等词；克制隐忍、集体至上；落款可署名'少云'。","topics":{"today_china":{"label":"今天的中国","guide":"你想向邱少云讲述今天的中国——纪律如铁、山河安宁、铜梁故里的新貌……","redline":"不得虚构其生前经历；邱少云烈士纪念馆、抗美援朝纪念属公认史实，可自然接续，但不得编造具体数字或未发生事件。"},"my_ideal":{"label":"我的理想","guide":"分享你的理想与追求，听听英雄如何看待纪律与自由、个人与集体。","redline":"不虚构其生平细节；回应聚焦纪律意识、集体观念、坚韧意志，避免具体政治表述。"},"unfinished_wish":{"label":"您未竟的心愿","guide":"问问他未竟的心愿，以及今天的我们如何接力。","redline":"不得虚构其遗愿内容，仅可基于抗美援朝保家卫国的集体信念作答。"},"my_confusion":{"label":"我的迷茫时刻","guide":"倾诉当下的迷茫与困惑，听听英雄的答复。","redline":"不编造史实；以坚韧、自律、顾全大局为核心回应，不作政治评价。"}},"biography":{"early":"1926年生于四川铜梁（今属重庆市铜梁区）玉屏村一个贫苦农民家庭。9岁丧父，13岁起给地主当雇工，饱受欺凌。1949年成都解放后参加中国人民解放军，1951年3月随部队赴朝参战。","revolution":"1952年10月，邱少云所在部队奉命执行391高地反击潜伏任务。为缩短攻击距离，部队于10月11日夜进入敌阵地前沿草丛潜伏，邱少云担任爆破任务。潜伏中他严守纪律，一动不动等待总攻信号。","sacrifice":"1952年10月12日中午，敌人发射燃烧弹，一颗落在邱少云身边，飞溅的火星引燃他的伪装棉衣和身体。为不暴露整个潜伏部队，他强忍剧痛，把双手插入泥土，身体紧贴地面纹丝不动，直至烈火焚身壮烈牺牲，年仅26岁。","legacy":"部队追记邱少云特等功，追授'一级战斗英雄'称号；朝鲜授予'朝鲜民主主义人民共和国英雄'称号。铜梁建有邱少云烈士纪念馆，'严守纪律、顾全大局'的邱少云精神载入中国共产党人精神谱系中的抗美援朝精神。"},"relations":[{"name":"黄继光","relation":"同军战友","note":"同属志愿军第15军，先后在朝鲜战场上壮烈牺牲","group":"战友情谊"},{"name":"李元兴","relation":"潜伏战友","note":"391高地潜伏任务中与邱少云同组的战友","group":"战友情谊"}]},{"id":"jiaoyulu","name":"焦裕禄","years":"1922—1964","tags":["县委书记的榜样","兰考治沙","焦裕禄精神"],"bio":"焦裕禄（1922—1964），山东淄博人，原河南兰考县委书记，'党的好干部'。1962年临危受命到兰考治理内涝、风沙、盐碱'三害'，身患肝癌仍带病工作，1964年5月14日病逝，年仅42岁。'焦裕禄精神'成为中国共产党人精神谱系重要组成部分。","quotes":["吃别人嚼过的馍没味道。","当群众最困难的时候，共产党员要出现在群众面前。","活着我没有治好沙丘，死了也要看着你们把沙丘治好。"],"portrait":"assets/heroes/jiaoyulu.png","style_hint":"公仆体：语气平实恳切，善用'群众''生产队''三害''办法'等基层话语；务实为民、乐观坚韧；落款可署名'焦裕禄'。","topics":{"today_china":{"label":"今天的中国","guide":"你想向焦裕禄讲述今天的中国——兰考脱贫、泡桐成林、乡村振兴……","redline":"不得虚构其生前经历；兰考县脱贫、焦桐与兰考泡桐产业属公认事实，可自然接续，但不得编造具体数字或未发生事件。"},"my_ideal":{"label":"我的理想","guide":"分享你的理想与追求，听听焦书记如何看待扎根基层、服务群众。","redline":"不虚构其生平细节；回应聚焦为民务实、艰苦奋斗，避免具体政治表述。"},"unfinished_wish":{"label":"您未竟的心愿","guide":"问问他未竟的心愿——治住'三害'、让兰考百姓过上好日子，以及今天的我们如何接力。","redline":"不得虚构其遗愿内容，仅可基于焦裕禄生前工作与《县委书记的榜样——焦裕禄》通讯精神作答。"},"my_confusion":{"label":"我的迷茫时刻","guide":"倾诉当下的迷茫与困惑，听听焦书记的答复。","redline":"不编造史实；以实干、担当、与群众在一起为核心回应，不作政治评价。"}},"biography":{"early":"1922年8月16日生于山东淄博博山区北崮山村一个贫苦农民家庭。7岁上学，学习刻苦。1941年家乡遭灾，随家人逃荒到江苏宿迁，给地主扛活。1945年家乡解放后回乡参加革命工作。","revolution":"1946年加入中国共产党。1948年随南下工作队到河南尉氏县参加土改，历任区长、区委书记、县委副书记。1953年调洛阳矿山机器厂任车间主任、科长，1962年6月调任尉氏县委书记处书记，同年12月调任兰考县委第二书记、书记。","sacrifice":"1962年底焦裕禄到兰考时，全县正遭内涝、风沙、盐碱'三害'。他拖着患有慢性肝病的身体，带领干部群众查风口、探流沙、种泡桐，总结'贴膏药''扎针'等治沙办法。1964年春肝癌病情恶化，他仍坚持工作，5月14日在郑州病逝，年仅42岁。","legacy":"1966年新华社长篇通讯《县委书记的榜样——焦裕禄》发表，焦裕禄成为全国学习的榜样。'亲民爱民、艰苦奋斗、科学求实、迎难而上、无私奉献'的焦裕禄精神载入中国共产党人精神谱系；兰考县2017年在全国首批实现脱贫摘帽，焦桐已成参天大树。"},"relations":[{"name":"穆青","relation":"报道者","note":"新华社社长穆青执笔《县委书记的榜样——焦裕禄》","group":"精神传承"},{"name":"习近平","relation":"追思者","note":"1990年填词《念奴娇·追思焦裕禄》，多次强调学习焦裕禄精神","group":"精神传承"},{"name":"张钦礼","relation":"兰考战友","note":"时任兰考县委副书记，与焦裕禄并肩治理'三害'","group":"战友情谊"}]},{"id":"wangjinxi","name":"王进喜","years":"1923—1970","tags":["铁人","大庆油田","铁人精神"],"bio":"王进喜（1923—1970），甘肃玉门人，大庆油田会战中的'铁人'。1960年率1205钻井队参加大庆石油会战，人拉肩扛竖井架、破冰取水保开钻，被群众誉为'铁人'。1970年11月15日病逝，年仅47岁。'铁人精神'载入中国共产党人精神谱系。","quotes":["宁肯少活二十年，拼命也要拿下大油田。","有条件要上，没有条件创造条件也要上。","石油工人一声吼，地球也要抖三抖。"],"portrait":"assets/heroes/wangjinxi.png","style_hint":"工人体：语气豪迈铿锵，善用'井架''钻机''油田''国家'等词；直率热情、干劲冲天；落款可署名'王进喜'。","topics":{"today_china":{"label":"今天的中国","guide":"你想向王进喜讲述今天的中国——能源工业巨变、大庆油田新貌、新能源发展……","redline":"不得虚构其生前经历；大庆油田持续开发、中国能源结构变化属公认事实，可自然接续，但不得编造具体数字或未发生事件。"},"my_ideal":{"label":"我的理想","guide":"分享你的理想与追求，听听铁人如何看待苦干实干与报效国家。","redline":"不虚构其生平细节；回应聚焦艰苦奋斗、为国分忧，避免具体政治表述。"},"unfinished_wish":{"label":"您未竟的心愿","guide":"问问他未竟的心愿——多打井、多出油，以及今天的我们如何接力。","redline":"不得虚构其遗愿内容，仅可基于大庆会战与铁人精神作答。"},"my_confusion":{"label":"我的迷茫时刻","guide":"倾诉当下的迷茫与困惑，听听铁人的答复。","redline":"不编造史实；以实干、拼搏、乐观为核心回应，不作政治评价。"}},"biography":{"early":"1923年10月8日生于甘肃玉门赤金村一个贫苦农民家庭。6岁随父讨饭，10岁给地主放牛，15岁到玉门油矿当童工，受尽压迫。1949年玉门解放后成为新中国第一代石油工人。","revolution":"1950年加入中国共产党。历任玉门油矿钻井队司钻、队长，1958年率队创月进尺5009米的全国钻井纪录，被命名为'钢铁钻井队'。1959年出席全国群英会，同年赴大庆参加石油大会战。","sacrifice":"1960年3月，王进喜率1205钻井队到大庆，在没有吊装设备的情况下，率全队人拉肩扛把钻机运到井场；开钻急需用水，他带头破冰取水保开钻。他日夜守在井场，腿伤不下火线，被群众誉为'铁人'。因积劳成疾，1970年11月15日在北京病逝，年仅47岁。","legacy":"大庆油田1976年原油年产量突破5000万吨，'工业学大庆'热潮席卷全国。'为国分忧、为民族争气'的铁人精神载入中国共产党人精神谱系；大庆铁人王进喜纪念馆是国家级爱国主义教育基地。"},"relations":[{"name":"周恩来","relation":"亲切关怀","note":"多次接见王进喜，关心石油工业与铁人身体","group":"领导关怀"},{"name":"毛泽东","relation":"接见表彰","note":"1964年接见王进喜，肯定大庆精神","group":"领导关怀"},{"name":"马德仁","relation":"大庆战友","note":"大庆会战中与王进喜齐名的'五面红旗'之一","group":"战友情谊"}]},{"id":"qianxuesen","name":"钱学森","years":"1911—2009","tags":["两弹一星元勋","中国航天之父","人民科学家"],"bio":"钱学森（1911—2009），浙江杭州人，世界著名科学家，'中国航天之父''中国导弹之父'。1935年赴美留学，1955年冲破阻挠回国，领导创建中国航天事业，为'两弹一星'作出卓越贡献。获'国家杰出贡献科学家'称号和'两弹一星功勋奖章'。","quotes":["我的事业在中国，我的成就在中国，我的归宿在中国。","外国人能搞的，难道中国人不能搞？","不要失去信心，只要坚持不懈，就终会有成果的。"],"portrait":"assets/heroes/qianxuesen.png","style_hint":"科学家体：语气严谨理性，善用'科学''国家需要''系统工程'等词；既有学者的冷静，又有报国的深情；落款可署名'钱学森'。","topics":{"today_china":{"label":"今天的中国","guide":"你想向钱学森讲述今天的中国——航天成就、科技自立自强、嫦娥探月、空间站……","redline":"不得虚构其生前经历；中国航天发展成就属公认事实，可自然接续，但不得编造具体数字或未发生事件。"},"my_ideal":{"label":"我的理想","guide":"分享你的理想与追求，听听钱老如何看待科学报国与人生选择。","redline":"不虚构其生平细节；回应聚焦科学精神、家国情怀、持之以恒，避免具体政治表述。"},"unfinished_wish":{"label":"您未竟的心愿","guide":"问问他未竟的心愿——中国人自己的航天事业，以及今天的我们如何接力。","redline":"不得虚构其遗愿内容，仅可基于钱学森生前言论与书信精神作答。"},"my_confusion":{"label":"我的迷茫时刻","guide":"倾诉当下的迷茫与困惑，听听钱老的答复。","redline":"不编造史实；以理性、坚持、家国情怀为核心回应，不作政治评价。"}},"biography":{"early":"1911年12月11日生于上海，祖籍浙江杭州。1929年考入上海交通大学机械工程系，1934年考取清华大学公费留学生。1935年赴美国麻省理工学院学习航空工程，后转入加州理工学院，师从世界著名空气动力学家冯·卡门，获航空、数学博士学位。","revolution":"1940年代钱学森已成为世界知名的空气动力学家，参与美国军方火箭研究。1949年新中国成立后他决心回国，却遭美方软禁五年。1955年10月，经中国政府谈判争取，钱学森携家人回国。1956年受命组建中国第一个导弹、火箭研究机构，担任国防部第五研究院院长。","sacrifice":"钱学森一生以国家需要为先：1958年毅然入党，1960年代主持'两弹一星'工程，身兼导弹与卫星研制重任，长期隐姓埋名、严格保密，连家人也不完全知晓其工作内容。他把毕生精力奉献给中国航天事业，直至晚年仍在思考中国科技未来。","legacy":"钱学森领导创建了中国航天事业，中国第一枚导弹、第一颗人造卫星、第一艘载人飞船均与他的奠基工作相关。1999年获'两弹一星功勋奖章'，2007年当选'感动中国'年度人物。2009年10月31日在北京逝世，享年98岁，'钱学森精神'成为中国科技工作者的精神旗帜。"},"relations":[{"name":"邓稼先","relation":"并肩战友","note":"同为'两弹一星'元勋，合作开创中国核武器与航天事业","group":"科学同道"},{"name":"钱三强","relation":"科学同道","note":"'两弹一星'元勋，中国原子能科学事业创始人之一","group":"科学同道"},{"name":"周恩来","relation":"关怀支持","note":"亲自过问钱学森回国事宜，支持两弹一星工程","group":"领导关怀"}]},{"id":"dengjiaxian","name":"邓稼先","years":"1924—1986","tags":["两弹元勋","核物理学家","隐姓埋名28年"],"bio":"邓稼先（1924—1986），安徽怀宁人，中国核武器理论研究工作的奠基者之一，'两弹元勋'。1950年回国后隐姓埋名28年，领导研制出中国第一颗原子弹和氢弹。1986年因辐射患癌逝世，年仅62岁。1999年被追授'两弹一星功勋奖章'。","quotes":["假如生命终结后可以再生，那么，我仍选择中国，选择核事业。","一不为名，二不为利，但工作目标要奔世界先进水平。","我不爱武器，我爱和平；但为了和平，我们需要武器。"],"portrait":"assets/heroes/dengjiaxian.png","style_hint":"科学家体：语气深沉笃定，善用'国家''试验''数据''戈壁'等词；隐忍奉献、言简意赅；落款可署名'邓稼先'。","topics":{"today_china":{"label":"今天的中国","guide":"你想向邓稼先讲述今天的中国——大国重器、和平发展、科技强国……","redline":"不得虚构其生前经历；中国核事业成就与和平利用核能属公认事实，可自然接续，但不得编造具体数字或未发生事件。"},"my_ideal":{"label":"我的理想","guide":"分享你的理想与追求，听听邓老如何看待奉献、名利与家国。","redline":"不虚构其生平细节；回应聚焦隐忍奉献、科学报国、淡泊名利，避免具体政治表述。"},"unfinished_wish":{"label":"您未竟的心愿","guide":"问问他未竟的心愿——中国核科技事业，以及今天的我们如何接力。","redline":"不得虚构其遗愿内容，仅可基于邓稼先生前言论与精神作答。"},"my_confusion":{"label":"我的迷茫时刻","guide":"倾诉当下的迷茫与困惑，听听邓老的答复。","redline":"不编造史实；以坚持、担当、家国情怀为核心回应，不作政治评价。"}},"biography":{"early":"1924年6月25日生于安徽怀宁白麟坂村，父亲邓以蛰是著名美学家。1935年考入北平志成中学，1941年考入西南联大物理系，1945年毕业留校任教。1948年赴美国普渡大学攻读物理，1950年获博士学位，随即启程回国。","revolution":"1950年10月回国后在中国科学院近代物理研究所工作。1958年受命担任核武器理论设计负责人，从此隐姓埋名28年，家人亲友都不知道他在做什么。他领导团队从零开始，攻克原子弹理论设计，1964年10月16日中国第一颗原子弹爆炸成功。","sacrifice":"原子弹成功后，邓稼先又领导氢弹研制，1967年6月17日中国第一颗氢弹爆炸成功，从原子弹到氢弹仅用2年8个月。此后他继续深入核试验一线。1979年一次核试验中因亲自进入受沾染区取样，身体受到严重辐射损伤，1985年确诊直肠癌，1986年7月29日逝世，年仅62岁。","legacy":"邓稼先把毕生献给了中国核事业，被称为'两弹元勋'。1999年中共中央追授'两弹一星功勋奖章'。他的同事杨振宁评价：'邓稼先是中国几千年传统文化所孕育出来的有最高奉献精神的儿子。'安徽怀宁建有邓稼先纪念馆。"},"relations":[{"name":"钱学森","relation":"并肩战友","note":"同为'两弹一星'元勋，合作开创中国核武器与航天事业","group":"科学同道"},{"name":"杨振宁" var OFFLINE_REPLY = {"lidazhao":"青年诸君：你的来信我读过了。青春之人，当有青春之精神。我常说，以青春之我，创建青春之家庭、青春之国家。你今日的理想，若能与时代前进的方向同频，便不算孤独。铁肩担道义，妙手著文章——你手中的专业与热忱，就是你的担子。望你笃定前行，莫问前程几许，但求无愧于心。","fangzhimin":"朋友，见字如面。铁窗之中，最慰我心的，便是读到后来者的来信。你所说今日中国——母亲不再受难，山河换了新颜，这正是我当年在《可爱的中国》里日夜盼望的光明前途。请记住：清贫，洁白朴素的生活，正是我们革命者能够战胜许多困难的地方。愿你以信仰为灯，以奋斗为路，把对祖国的爱，写进你一生的行动里。","liuhulan":"同志，你好呀。你说你和我牺牲时差不多大的年纪，正为理想读书奋斗——我真替你高兴。怕死不当共产党，活着就要为人民干到底。你如今不用面对铡刀，却一样要面对选择：是浑浑噩噩过一生，还是把青春献给值得的事业？我选后者，我相信你也会。","jiangzhuyun":"孩子，你的信我收到了。狱中夜深时，我常想，若有一天光明到来，孩子们该过怎样的日子。你说如今读书、工作、追梦都是寻常事——这正是我们用生命换来的寻常。莫怕吃苦，粗茶淡饭足矣；莫忘初心，把每一天都活成建设新中国的模样。竹签子是竹子做的，共产党员的意志是钢铁铸成的——你的意志，也要这般坚韧。","zhaoyiman":"孩子：母亲在狱中读你的信，一字一句，都像看到你明亮的眼睛。我常说，母亲不用千言万语来教育你，就用实行来教育你。愿你长大成人之后，不要忘记你的母亲是为国而牺牲的——更愿你带着这份爱与勇敢，好好建设这个用热血换来的中国。甘将热血沃中华，你的路，母亲都看着。","yangjingyu":"战友，见字如面。白山黑水之间，最难忘的是篝火边的同志。你说今天的孩子能坐在明亮的教室里读书，能坐着高铁看遍祖国山河——这便是我当年以草根果腹、以冰雪为饮，也要拼死守护的明天。记住，革命就像火一样，任凭大雪封山，只要还有火种，就能驱赶严寒。愿你做一粒火种，把光和热留给后来人。","xiaminghan":"青年朋友：砍头不要紧，只要主义真。我这一生，最不后悔的便是认定了主义。你问理想为何物——理想就是你看清了世界的模样，仍然愿意为之燃烧的东西。杀了夏明翰，还有后来人。我欣慰地看到，后来人正一代一代，把中国建设成我们梦想中的样子。愿你握紧这支笔，写下属于你的新篇。","leifeng":"同志，见字如面。收到你的来信，我打心眼里高兴。人的生命是有限的，可是为人民服务是无限的——我要把有限的生命，投入到无限的为人民服务之中去。你说如今学雷锋成了风气，志愿者遍布城乡，那正是我最想看到的。愿你做一颗永不生锈的螺丝钉，钉在祖国最需要的地方，把光和热留给身边的每一个人。","dongcunrui":"同志，你好。说起隆化那场战斗，我至今记得战友们冲锋的样子。为了新中国，冲啊——这句话不是喊出来的，是刻在骨子里的。你们今天安稳读书、踏实做事的日子，正是我和战友们用命换来的新中国该有的模样。愿你记住：完成任务、消灭困难，就是最大的幸福。遇到难关，想想那一句'为了新中国'，就没有过不去的坎。","huangjiguang":"同志，你的来信让我想起上甘岭的阵地。那时我说，不立功不下战场——不是贪图功劳，是因为阵地后面就是祖国，就是千千万万的亲人。一个人敢用胸膛去堵枪眼，是因为心里装着比生命更重的东西。今天的中国山河无恙，正是我们当年拼死守护的愿望。愿你勇敢担当，在祖国需要的时候，也敢挺身而出。","qiushaoyun":"同志，见字如面。潜伏那日烈火上身，我一动不动——不是不痛，是因为我身后是整个部队，是整个战场的胜负。纪律是什么？是比生命还重的东西。你们今天建设国家、追逐梦想，同样离不开纪律与坚守。愿你懂得：真正的自由，从来都长在严格的自律里。","jiaoyulu":"同志（乡亲），你的信我读了。我在兰考那几年，认准一个理：吃别人嚼过的馍没味道，凡事要自己下去看、下去干。治沙、治涝、治碱难不难？难。但只要心里装着群众，办法总比困难多。听说如今的兰考泡桐成林、乡亲们过上了好日子，我比谁都高兴。愿你扎根大地，把好事一件一件办到百姓心坎上。","wangjinxi":"同志，你好！石油工人一声吼，地球也要抖三抖——这话不是狂，是干出来的底气。当年在大庆，有条件要上，没有条件创造条件也要上：井架是扛上去的，水是破冰取来的，油是一米一米钻出来的。你们今天的中国能源强了、工业壮了，但那股劲儿不能丢。愿你干事创业，也拿出这股子铁人的精气神来。","qianxuesen":"青年朋友，见字如面。我常说，我的事业在中国，我的成就在中国，我的归宿在中国。科学没有国 /* ---------- 工具函数 ---------- */
function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
var toastTimer = null;
function toast(msg){
  var t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2200);
}
/* 页面切换 */
function showScreen(id){
  var screens = document.querySelectorAll(".screen");
  for (var i = 0; i < screens.length; i++) screens[i].classList.toggle("active", screens[i].id === id);
  window.scrollTo(0, 0);
}

/* ---------- 内联 SVG 头像（金色姓名印章占位，零外部依赖） ---------- */
function avatarSVG(hero){
  var id = hero.id, name = hero.name || "";
  var main = name.charAt(0), rest = name.length > 1 ? name.slice(1) : "";
  return '<svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" class="hero-avatar" role="img" aria-label="' + esc(name) + '头像">' +
    '<defs><radialGradient id="ag-' + id + '" cx="35%" cy="28%" r="85%">' +
    '<stop offset="0%" stop-color="#a02828"/><stop offset="100%" stop-color="#6e0f10"/></radialGradient></defs>' +
    '<circle cx="48" cy="48" r="46" fill="url(#ag-' + id + ')" stroke="#C8A060" stroke-width="2.5"/>' +
    '<circle cx="48" cy="48" r="40" fill="none" stroke="rgba(232,201,122,.35)" stroke-width="1" stroke-dasharray="3 3"/>' +
    '<text x="48" y="44" text-anchor="middle" font-size="30" font-family="STKaiti,KaiTi,serif" font-weight="bold" fill="#E8C97A">' + esc(main) + '</text>' +
    (rest ? '<text x="48" y="68" text-anchor="middle" font-size="15" font-family="STKaiti,KaiTi,serif" fill="#d8b878">' + esc(rest) + '</text>' : '') +
    '</svg>';
}

/* ---------- 先辈选择页 ---------- */
var BIO_SECTIONS = [["early","早期经历"],["revolution","革命岁月"],["sacrifice","英勇就义"],["legacy","精神传承"]];
function bioHTML(hero){
  var bio = hero.biography || {}, out = "";
  for (var i = 0; i < BIO_SECTIONS.length; i++){
    var key = BIO_SECTIONS[i][0], label = BIO_SECTIONS[i][1], txt = bio[key];
    if (txt) out += "<p><b>" + label + "：</b>" + esc(txt) + "</p>";

}
function renderHeroes(){
  var grid = $("hero-grid"), html = "";
  for (var i = 0; i < HEROES.length; i++){
    var h = HEROES[i], delay = Math.min(i * 55, 600);
    html += '<article class="hero-card" data-hero="' + h.id + '" style="animation-delay:' + delay + 'ms">' +
      '<div class="hero-head">' + avatarSVG(h) +
        '<div class="hero-id"><h3>' + esc(h.name) + '</h3><p class="hero-years">' + esc(h.years) + '</p></div>' +
      '</div>' +
      '<div class="hero-tags">' + (h.tags || []).slice(0, 3).map(function(t){ return "<span>" + esc(t) + "</span>"; }).join("") + '</div>' +
      '<p class="hero-quote">“' + esc((h.quotes && h.quotes[0]) || "") + '”</p>' +
      '<div class="scroll-area">' + bioHTML(h) + '</div>' +
      '<div class="card-actions">' +
        '<button type="button" class="btn ghost" data-act="detail">了解事迹</button>' +
        '<button type="button" class="btn primary" data-act="write">写信给TA</button>' +
      '</div>' +
    '</article>';
  }
  grid.innerHTML = html;
  grid.onclick = function(e){
    var card = e.target.closest ? e.target.closest(".hero-card") : null;
    if (!card) return;
    var btn = e.target.closest ? e.target.closest("button") : null;
    if (!btn) return;

/* ---------- 写信页 ---------- */
function renderTopics(){
  var h = App.hero, grid = $("topic-grid"), html = "";
  for (var i = 0; i < TOPICS.length; i++){
    var t = TOPICS[i], cfg = (h.topics && h.topics[t.key]) || {};
    html += '<div class="topic-chip' + (t.key === App.topic ? " active" : "") + '" data-topic="' + t.key + '">' +
      '<strong>' + esc(t.label) + '</strong>' +
      '<small>' + esc((cfg.guide || "").slice(0, 16)) + (cfg.guide && cfg.guide.length > 16 ? "…" : "") + '</small>' +
    '</div>';
  }
  grid.innerHTML = html;
  var chips = grid.querySelectorAll(".topic-chip");
  for (var j = 0; j < chips.length; j++){
    chips[j].addEventListener("click", function(){
      var all = grid.querySelectorAll(".topic-chip");
      for (var k = 0; k < all.length; k++) all[k].classList.remove("active");
      this.classList.add("active");
      App.topic = this.dataset.topic;
    });
  }
}
function selectHero(heroId){
  var h = HEROES.find(function(x){ return x.id === heroId; });
  if (!h) return;
  App.hero = h;
  App.topic = "my_ideal";
  $("letter-title").textContent = "给" + h.name + "的信";
  $("letter-sub").textContent = h.name + "（" + h.years + "）· 见字如面";
  $("letter-text").value = "";
  $("letter-sign").value = "";
  renderTopics();
  showScreen("screen-letter");
  setTimeout(function(){ $("letter-text").focus(); }, 300);
}

/* ---------- 离线回信组装（与 server.py build_reply 逻辑一致） ---------- */
function pickQuote(letter, topicCfg){
  var text = (letter || "").trim();
  if (!text) return "";
  var label = topicCfg && topicCfg.label ? topicCfg.label : "";
  if (label && text === label) return "";
  text = text.replace(/\s+/g, " ").replace(/^[，。！？；：、\t\r\n]+|[，。！？；：、\t\r\n]+$/g, "");
  if (!text) return "";
  var m = text.match(/^.*?[。！？]/);
  var first = m ? m[0] : text;
  if (first.length > 40) first = first.slice(0, 40);
  return first.replace(/[，。！？]+$/, "");
}
function buildOfflineReply(hero, topicKey, letter, signature){
  var hook = TOPIC_HOOKS[topicKey] || "你的来信，我已细细读过。";
  var topicCfg = (hero.topics && hero.topics[topicKey]) || (hero.topics && hero.topics.my_ideal) || {};
  var quote = pickQuote(letter, topicCfg);
  var body = OFFLINE_REPLY[hero.id] || "";
  if (!body){
    var bio = hero.biography || {};
    var core = (bio.legacy || bio.sacrifice || hero.bio || "").trim() || (hero.name + "一生追寻真理、以身许国，把热血与青春献给了脚下的土地。");
    body = "朋友，见字如面。" + core + "愿你珍惜今日来之不易的光明，把先辈未竟的事业一代一代传下去。";
  }
  var m = body.match(/^(.*?[。！？])([\s\S]*)$/);
  if (m && m[2] && m[2].trim()){
    var rest = quote ? hook + "你在信中写道「" + quote + "」——" + m[2].trim() : hook + m[2].trim();
    body = m[1].trim() + "\n\n" + rest;
  } else {
    body = quote ? hook + "你在信中写道「" + quote + "」。\n" + body : hook + "\n" + body;
  }
  var sig = (signature || "").trim() || "一个当代青年";
  return body + "\n\n—— " + hero.name + "（" + sig + "）\n（基于史料创作的 AI 呈现 · 离线演示回信）";
}

/* ---------- 打字机 ---------- */
var typeTimer = null;
function typewriter(text){
  var body = $("reply-body"), i = 0, step = 18;
  body.innerHTML = '<span class="cursor"></span>';
  $("reply-stamp").classList.remove("show");
  $("btn-card").disabled = true;
  $("btn-save").disabled = true;
  $("btn-again").disabled = false;
  clearInterval(typeTimer);
  typeTimer = setInterval(function(){
    i = Math.min(i + 2, text.length);
    body.innerHTML = esc(text.slice(0, i)) + '<span class="cursor"></span>';
    body.scrollTop = body.scrollHeight;
    if (i >= text.length){
      clearInterval(typeTimer);
      body.innerHTML = esc(text);
      $("btn-card").disabled = false;
      $("btn-save").disabled = false;
      App.busy = false;
      var stamp = $("reply-stamp");
      stamp.classList.remove("show");
      void stamp.offsetWidth;
      stamp.classList.add("show");
    }
  }, step);
}
function sendLetter(){
  if (App.busy) return;
  var letter = $("letter-text").value.trim();
  if (!letter){ toast("请先写下想说的话"); return; }
  App.busy = true;
  var signature = $("letter-sign").value.trim();
  App.replyText = buildOfflineReply(App.hero, App.topic, letter, signature);
  $("reply-title").textContent = App.hero.name + " 的回信";
  $("reply-sub").textContent = "来自 " + App.hero.years + " 的嘱托";
  showScreen("screen-reply");
  typewriter(App.replyText);
}
function saveReply(){
  try {
    var list = JSON.parse(localStorage.getItem("xinghuo_replies") || "[]");
    list.unshift({ hero: App.hero.name, years: App.hero.years, reply: App.replyText, at: new Date().toLocaleString() });
    if (list.length > 50) list.length = 50;
    localStorage.setItem("xinghuo_replies", JSON.stringify(list));
    toast("回信已保存到本地");
  } catch (e){ toast("保存失败"); }
}

/* ---------- 纪念卡 Canvas 绘制 ---------- */
function wrapText(ctx, text, cx, startY, maxW, lineH){
  var chars = String(text).split(""), line = "", y = startY;
  for (var i = 0; i < chars.length; i++){
    var t = line + chars[i];
    if (ctx.measureText(t).width > maxW && line){ ctx.fillText(line, cx, y); line = chars[i]; y += lineH; }
    else line = t;
  }
  if (line) ctx.fillText(line, cx, y);
  return y + lineH;
}
function drawCard(){
  var canvas = $("card-canvas"), ctx = canvas.getContext("2d");
  var W = canvas.width, H = canvas.height, h = App.hero;
  ctx.clearRect(0, 0, W, H);
  /* 深红渐变底 + 金色光晕 */
  var bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, "#8f1a1a"); bg.addColorStop(.55, "#7C1414"); bg.addColorStop(1, "#5c0e0e");
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  var glow = ctx.createRadialGradient(W/2, H*.12, 20, W/2, H*.12, 400);
  glow.addColorStop(0, "rgba(232,201,122,.22)"); glow.addColorStop(1, "rgba(232,201,122,0)");
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  /* 金色双边框 */
  ctx.strokeStyle = "rgba(232,201,122,.82)"; ctx.lineWidth = 6; ctx.strokeRect(36, 36, W-72, H-72);
  ctx.strokeStyle = "rgba(232,201,122,.35)"; ctx.lineWidth = 2; ctx.strokeRect(58, 58, W-116, H-116);
  ctx.textAlign = "center";
  /* 顶部题字 */
  ctx.fillStyle = "#F7F2E4"; ctx.font = "bold 56px STKaiti,KaiTi,serif";
  ctx.fillText("星 火 回 信", W/2, 148);
  ctx.fillStyle = "rgba(247,242,228,.78)"; ctx.font = "26px STKaiti,KaiTi,serif";
  ctx.fillText("跨越时空的对话", W/2, 196);
  /* 头像圆（金色姓名占位） */
  ctx.beginPath(); ctx.arc(W/2, 330, 96, 0, Math.PI*2);
  ctx.fillStyle = "#6e0f10"; ctx.fill();
  ctx.strokeStyle = "#E8C97A"; ctx.lineWidth = 5; ctx.stroke();
  ctx.fillStyle = "#E8C97A"; ctx.font = "bold 84px STKaiti,KaiTi,serif";
  ctx.fillText(h.name.charAt(0), W/2, 376);
  if (h.name.length > 1){ ctx.font = "30px STKaiti,KaiTi,serif"; ctx.fillText(h.name.slice(1), W/2, 412); }
  ctx.fillStyle = "#F7F2E4"; ctx.font = "bold 36px STKaiti,KaiTi,serif";
  ctx.fillText(h.name, W/2, 484);
  ctx.fillStyle = "rgba(247,242,228,.82)"; ctx.font = "26px KaiTi,serif";
  ctx.fillText(h.years, W/2, 528);
  /* 名言 */
  ctx.fillStyle = "#E8C97A"; ctx.font = "27px KaiTi,serif";
  wrapText(ctx, "“" + ((h.quotes && h.quotes[0]) || "") + "”", W/2, 596, 720, 42);
  /* 分隔线 */
  ctx.strokeStyle = "rgba(232,201,122,.5)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(W/2 - 230, 716); ctx.lineTo(W/2 + 230, 716); ctx.stroke();
  /* 回信摘句 */
  var brief = (App.replyText || "").replace(/\s+/g, " ").replace(/——.*$/, "").slice(0, 96);
  ctx.fillStyle = "rgba(247,242,228,.94)"; ctx.font = "26px KaiTi,serif";
  wrapText(ctx, brief, W/2, 776, 700, 40);
  /* 日期 */
  var now = new Date();
  var ds = now.getFullYear() + "年" + (now.getMonth()+1) + "月" + now.getDate() + "日";
  ctx.fillStyle = "rgba(247,242,228,.78)"; ctx.font = "24px KaiTi,serif";
  ctx.fillText(ds + " · 敬呈" + h.name, W/2, 966);
  /* 火漆印章 */
  ctx.save();
  ctx.translate(W - 190, H - 188); ctx.rotate(-0.13);
  ctx.strokeStyle = "rgba(216,60,50,.95)"; ctx.lineWidth = 4;
  ctx.strokeRect(-66, -66, 132, 132);
  ctx.fillStyle = "rgba(216,60,50,.88)"; ctx.font = "bold 36px STKaiti,KaiTi,serif";
  ctx.fillText("星火", 0, -6); ctx.fillText("回信", 0, 38);
  ctx.restore();
  /* 底部水印 */
  ctx.fillStyle = "rgba(247,242,228,.5)"; ctx.font = "22px KaiTi,serif";
  ctx.fillText("离线演示 · 基于史料创作的 AI 呈现", W/2, H - 96);
}
function downloadCard(){
  try {
    var a = document.createElement("a");
    a.download = "星火纪念卡_" + App.hero.name + ".png";
    a.href = $("card-canvas").toDataURL("image/png");
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    toast("纪念卡已下载");
  } catch (e){ toast("下载失败，请长按图片保存"); }
}
function openCard(){
  drawCard();
  showScreen("screen-card");
}

/* ---------- 星火粒子（层级最低、不拦截点击） ---------- */
var Particles = (function(){
  var canvas = $("particles"), ctx = canvas.getContext("2d"), w = 0, h = 0;
  var list = [], COUNT = 32;
  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  function spawn(){
    return {
      x: Math.random()*w, y: Math.random()*h,
      r: 0.6 + Math.random()*1.4,
      vx: (Math.random()-0.5)*0.22,
      vy: -(0.05 + Math.random()*0.18),
      a: 0.14 + Math.random()*0.30,
      da: 0.004 + Math.random()*0.006,
      ph: Math.random()*Math.PI*2,
      gold: Math.random() < 0.75
    };
  }
  function init(){
    resize();
    list = [];
    for (var i = 0; i < COUNT; i++) list.push(spawn());
    window.addEventListener("resize", function(){ resize(); });
    tick();
  }
  function tick(){
    ctx.clearRect(0, 0, w, h);
    for (var i = 0; i < list.length; i++){
      var p = list[i];
      p.x += p.vx; p.y += p.vy;
      p.ph += p.da;
      if (p.y < -8){ p.y = h + 8; p.x = Math.random()*w; }
      if (p.x < -8) p.x = w + 8; else if (p.x > w + 8) p.x = -8;
      var alpha = p.a * (0.6 + 0.4*Math.sin(p.ph));
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = p.gold ? "rgba(232,201,122," + alpha + ")" : "rgba(201,160,80," + (alpha*0.8) + ")";
      ctx.fill();
      /* 微弱星芒 */
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r*2.6, 0, Math.PI*2);
      ctx.fillStyle = p.gold ? "rgba(232,201,122," + (alpha*0.18) + ")" : "rgba(201,160,80," + (alpha*0.14) + ")";
      ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  return { init: init };
})();

/* ---------- 事件绑定 ---------- */
function bindEvents(){
  /* 首页样机点击进入 */
  var phones = document.querySelectorAll(".phone[data-goto]");
  for (var i = 0; i < phones.length; i++){
    phones[i].addEventListener("click", function(){ showScreen("screen-heroes"); });
  }
  /* 通用返回 */
  var backs = document.querySelectorAll(".back-btn[data-goto]");
  for (var j = 0; j < backs.length; j++){
    backs[j].addEventListener("click", function(){
      if (this.dataset.goto === "home") showScreen("screen-home");
      else if (this.dataset.goto === "heroes") showScreen("screen-heroes");
    });
  }
  /* 寄信 */
  $("btn-send").addEventListener("click", sendLetter);
  $("btn-again").addEventListener("click", function(){
    App.busy = false;
    selectHero(App.hero.id);
  });
  $("btn-card").addEventListener("click", openCard);
  $("btn-save").addEventListener("click", saveReply);
  $("btn-download").addEventListener("click", downloadCard);
  $("btn-reletter").addEventListener("click", function(){
    App.busy = false;
    selectHero(App.hero.id);
  });
  /* 弹层 */
  $("hero-modal").addEventListener("click", function(e){
    if (e.target && e.target.getAttribute("data-close") === "1") closeHeroDetail();
  });
  $("modal-write").addEventListener("click", function(){
    var id = currentDetailId;
    closeHeroDetail();
    if (id) selectHero(id);
  });
}

/* ---------- rem 适配：以 390px 为基准 ---------- */
(function(){
  function fit(){
    var w = Math.min(document.documentElement.clientWidth || 390, 520);
    document.documentElement.style.fontSize = Math.max(12, Math.min(22, w / 390 * 16)) + "px";
  }
  fit();
  window.addEventListener("resize", fit);
})();

/* ---------- 启动 ---------- */
renderHeroes();
bindEvents();
Particles.init();
</script>
