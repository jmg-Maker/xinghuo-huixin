<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>鏄熺伀鍥炰俊 路 璺ㄨ秺鏃剁┖鐨勫璇?/title>
<style>
/* ============ 鍩虹涓庡彉閲?============ */
:root{
  --bg-deep:#7C1414; --bg-deeper:#5c0e0e; --bg-mid:#8f1a1a;
  --paper:#F7F2E4; --paper-dim:#e9ddc2;
  --gold:#C8A060; --gold-hi:#E8C97A; --gold-dim:rgba(200,160,96,.45);
  --brown:#3A281C; --ink:#2c1c12; --seal:#d83c32;
  --font-display:"STKaiti","KaiTi","SimSun",serif;
  --font-body:"PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font-body); color:var(--brown);
  min-height:100vh; overflow-x:hidden;
  background:
    radial-gradient(1200px 620px at 18% -10%, rgba(232,201,122,.16), transparent 60%),
    radial-gradient(900px 520px at 88% 12%, rgba(255,255,255,.06), transparent 60%),
    radial-gradient(1000px 700px at 50% 110%, rgba(0,0,0,.35), transparent 70%),
    linear-gradient(180deg, var(--bg-mid) 0%, var(--bg-deep) 48%, var(--bg-deeper) 100%);
  background-attachment:fixed;
}
/* 瀹ｇ焊绾ょ淮灞傦細缁嗗井妯旱绾圭悊妯℃嫙绾稿紶 */
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.5;
  background:
    repeating-linear-gradient(0deg, rgba(247,242,228,.015) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.02) 0 1px, transparent 1px 4px);
}
.paper-fiber{
  position:fixed; inset:0; z-index:1; pointer-events:none;
  background:
    radial-gradient(560px 400px at 30% 22%, rgba(232,201,122,.08), transparent 70%),
    radial-gradient(480px 360px at 76% 64%, rgba(255,255,255,.05), transparent 70%);
}
/* 鏄熺伀绮掑瓙鐢诲竷锛氬眰绾ф渶浣庛€佷笉鎷︽埅鐐瑰嚮 */
#particles{position:fixed; inset:0; z-index:1; pointer-events:none}

/* ============ 搴旂敤瀹瑰櫒涓庨〉闈㈠垏鎹?============ */
.app{position:relative; z-index:2; min-height:100vh; max-width:520px; margin:0 auto}
.screen{display:none; flex-direction:column; min-height:100vh; padding:1rem 1.1rem calc(1.6rem + env(safe-area-inset-bottom))}
.screen.active{display:flex; animation:fadeUp .5s ease both}
@keyframes fadeUp{from{opacity:0; transform:translateY(18px)} to{opacity:1; transform:none}}

/* 椤堕儴閫氱敤杩斿洖鏉?*/
.screen-head{display:flex; align-items:center; gap:.7rem; margin-bottom:.9rem; color:var(--gold-hi)}
.back-btn{
  width:2.2rem; height:2.2rem; flex:0 0 auto; border-radius:50%;
  border:1px solid var(--gold-dim); background:rgba(58,40,28,.25); color:var(--gold-hi);
  font-size:1.1rem; line-height:1; display:flex; align-items:center; justify-content:center;
}
.back-btn:active{transform:scale(.92)}
.screen-head h2{font-family:var(--font-display); font-size:1.35rem; letter-spacing:.12em}

/* 閲戣竟鎸夐挳 */
.btn{
  font-family:var(--font-body); border-radius:.55rem; border:1px solid var(--gold);
  background:transparent; color:var(--brown); padding:.6rem 1rem; font-size:.95rem;
  cursor:pointer; transition:transform .12s ease, box-shadow .12s ease; touch-action:manipulation;
}
.btn:active{transform:scale(.95)}
.btn.primary{background:linear-gradient(160deg, var(--gold-hi), var(--gold)); color:#3a2410; box-shadow:0 3px 10px rgba(0,0,0,.22)}
.btn.ghost{background:rgba(247,242,228,.92); border-color:var(--gold-dim)}
.btn.wide{width:100%; padding:.85rem; font-size:1.05rem; letter-spacing:.15em}
.btn[disabled]{opacity:.55; pointer-events:none}

/* ============ 棣栭〉锛氭爣棰?+ 涓夋墜鏈烘牱鏈?============ */
.home-hero{text-align:center; padding:1.5rem .5rem .4rem}
.poster-title{
  font-family:var(--font-display); font-weight:bold; color:var(--gold-hi);
  font-size:2.9rem; letter-spacing:.28em; text-shadow:0 2px 14px rgba(0,0,0,.4);
}
.poster-sub{margin-top:.5rem; color:var(--paper); font-family:var(--font-display); font-size:1.1rem; letter-spacing:.5em; opacity:.92}
.home-seal{
  display:inline-block; margin-top:.9rem; width:3.1rem; height:3.1rem; line-height:1;
  border:2px solid rgba(216,60,50,.9); color:#e8796f; border-radius:.4rem;
  font-family:var(--font-display); font-size:.95rem; font-weight:bold; padding:.28rem 0;
  transform:rotate(-8deg); letter-spacing:.05em; opacity:.9;
}
.phone-stack{display:flex; align-items:center; justify-content:center; gap:.55rem; padding:1.6rem .2rem .6rem}
.phone{
  position:relative; flex:0 0 auto; width:6.4rem; border-radius:1.1rem; cursor:pointer;
  background:linear-gradient(160deg,#3a2a1e,#1d130d); padding:.42rem; touch-action:manipulation;
  box-shadow:0 10px 26px rgba(0,0,0,.5), inset 0 0 0 1px rgba(232,201,122,.28);
  transition:transform .2s ease;
}
.phone:hover{transform:translateY(-3px)}
.phone:active{transform:scale(.96)}
.phone-main{width:9rem; transform:translateY(-.35rem); box-shadow:0 14px 30px rgba(0,0,0,.55), inset 0 0 0 1px rgba(232,201,122,.5)}
.phone-side.top{transform:translateY(.45rem)}
.phone-side.bot{transform:translateY(1.1rem)}
.phone-notch{width:2rem; height:.3rem; border-radius:.15rem; background:rgba(0,0,0,.65); margin:0 auto .35rem}
.phone-screen{background:var(--paper); border-radius:.75rem; overflow:hidden; height:11rem; position:relative; color:var(--ink); font-size:.52rem; padding:.5rem .55rem}
.phone-main .phone-screen{height:12.6rem}
.mock-num{
  position:absolute; top:-.55rem; left:50%; transform:translateX(-50%); z-index:3;
  background:var(--gold); color:#3a2410; font-weight:bold; font-size:.6rem; letter-spacing:.08em;
  border-radius:1rem; padding:.12rem .5rem; box-shadow:0 2px 6px rgba(0,0,0,.4);
}
.mock-title{display:block; font-family:var(--font-display); font-weight:bold; font-size:.68rem; margin-bottom:.4rem; color:var(--bg-deep)}
.mock-line{display:block; height:.34rem; background:rgba(58,40,28,.18); border-radius:.1rem; margin:.3rem 0}
.mock-line.short{width:62%}
.mock-btn{
  display:inline-block; margin-top:.45rem; padding:.18rem .6rem; border-radius:.3rem;
  background:linear-gradient(160deg,var(--gold-hi),var(--gold)); color:#3a2410; font-size:.52rem;
}
.mock-reply-title{display:block; font-family:var(--font-display); font-weight:bold; font-size:.66rem; color:var(--bg-deep); margin-bottom:.3rem}
.mock-text{line-height:1.5; color:rgba(44,28,18,.85)}
.mock-cursor{display:inline-block; width:.18rem; height:.62rem; background:var(--bg-deep); vertical-align:-.08rem; animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.mock-seal{
  position:absolute; right:.5rem; bottom:.5rem; width:1.7rem; height:1.7rem; border:1px solid var(--seal);
  color:var(--seal); font-family:var(--font-display); font-size:.5rem; border-radius:.2rem; display:flex;
  align-items:center; justify-content:center; transform:rotate(-10deg); opacity:.85;
}
.mock-card-body{position:absolute; inset:.5rem; border-radius:.5rem; background:linear-gradient(170deg,#8f1a1a,#5c0e0e); text-align:center; color:var(--gold-hi)}
.mock-card-avatar{
  display:flex; width:2.6rem; height:2.6rem; margin:.85rem auto .3rem; border-radius:50%;
  background:rgba(110,15,16,.85); border:1px solid var(--gold); align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:bold; font-size:1.1rem;
}
.mock-card-body b{display:block; font-family:var(--font-display); font-size:.68rem}
.mock-card-body i{font-style:normal; font-size:.5rem; color:rgba(232,201,122,.85)}
.home-hint{text-align:center; color:rgba(247,242,228,.8); font-size:.85rem; margin-top:.35rem; letter-spacing:.08em}
.ink-mountain{margin-top:1.1rem; text-align:center; opacity:.55; pointer-events:none}
.ink-mountain svg{width:88%; height:auto; display:inline-block}

/* ============ 鍏堣緢閫夋嫨椤?============ */
.hero-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(15.2rem, 1fr)); gap:.9rem}
.hero-card{
  background:
    radial-gradient(220px 120px at 20% 0%, rgba(232,201,122,.12), transparent 70%),
    var(--paper);
  border-radius:.9rem; border:1px solid var(--gold-dim);
  padding:.9rem .85rem .85rem; box-shadow:0 6px 18px rgba(0,0,0,.35);
  display:flex; flex-direction:column; animation:fadeUp .55s ease both;
}
.hero-head{display:flex; align-items:center; gap:.7rem}
.hero-avatar{width:3.6rem; height:3.6rem; flex:0 0 auto; border-radius:50%}
.hero-id h3{font-family:var(--font-display); font-size:1.3rem; color:var(--bg-deep)}
.hero-years{font-size:.82rem; color:rgba(58,40,28,.75); margin-top:.1rem}
.hero-tags{margin:.6rem 0 .35rem; display:flex; flex-wrap:wrap; gap:.3rem}
.hero-tags span{
  font-size:.72rem; color:var(--brown); border:1px solid var(--gold-dim);
  border-radius:2rem; padding:.08rem .5rem; background:rgba(200,160,96,.14);
}
.hero-quote{font-family:var(--font-display); font-size:.88rem; line-height:1.6; color:rgba(58,40,28,.9); margin:.15rem 0 .5rem}
/* 鍥哄畾楂樺害婊氬姩浜嬭抗妗嗭細浠呭唴閮ㄦ粴鍔紝鏁村崱涓嶆粴鍔?*/
.scroll-area{
  height:7.4rem; overflow-y:auto; padding:.35rem .5rem .1rem; border-left:2px solid var(--gold-dim);
  font-size:.8rem; line-height:1.75; color:rgba(58,40,28,.88); background:rgba(200,160,96,.06);
  border-radius:.3rem; margin-bottom:.7rem; -webkit-overflow-scrolling:touch;
}
.scroll-area p{margin-bottom:.4rem}
.scroll-area b{color:var(--bg-deep); font-weight:600}
.scroll-area::-webkit-scrollbar{width:4px}
.scroll-area::-webkit-scrollbar-thumb{background:var(--gold-dim); border-radius:2px}
.scroll-area::-webkit-scrollbar-track{background:transparent}
.card-actions{display:flex; gap:.55rem}
.card-actions .btn{flex:1; font-size:.88rem; padding:.52rem .4rem}

/* ============ 鍐欎俊椤?============ */
.letter-paper{
  position:relative; background:var(--paper); border-radius:.9rem; border:1px solid var(--gold-dim);
  padding:1.1rem 1rem 1.2rem; box-shadow:0 8px 22px rgba(0,0,0,.35); flex:1; display:flex; flex-direction:column;
}
.letter-head{text-align:center; margin-bottom:.8rem; border-bottom:1px dashed var(--gold-dim); padding-bottom:.7rem}
.letter-head h2{font-family:var(--font-display); color:var(--bg-deep); font-size:1.5rem; letter-spacing:.08em}
.letter-head p{font-size:.8rem; color:rgba(58,40,28,.7); margin-top:.25rem; font-family:var(--font-display)}
.topic-grid{display:grid; grid-template-columns:1fr 1fr; gap:.5rem; margin-bottom:.7rem}
.topic-chip{
  border:1px solid var(--gold-dim); border-radius:.55rem; padding:.45rem .5rem; cursor:pointer;
  background:rgba(200,160,96,.08); transition:all .15s ease; touch-action:manipulation;
}
.topic-chip strong{display:block; font-size:.86rem; color:var(--brown)}
.topic-chip small{display:block; font-size:.66rem; color:rgba(58,40,28,.6); margin-top:.1rem; line-height:1.35}
.topic-chip.active{background:linear-gradient(160deg,var(--gold-hi),var(--gold)); border-color:var(--gold)}
.topic-chip.active strong,.topic-chip.active small{color:#3a2410}
#letter-text{
  flex:1; min-height:9.4rem; resize:none; border:1px solid var(--gold-dim); border-radius:.55rem;
  background:rgba(247,242,228,.6); font-family:var(--font-body); font-size:.95rem; line-height:1.8;
  padding:.7rem .8rem; color:var(--ink); outline:none;
}
#letter-text::placeholder{color:rgba(58,40,28,.4)}
#letter-sign{
  margin-top:.6rem; border:1px solid var(--gold-dim); border-radius:.55rem; padding:.6rem .8rem;
  font-size:.9rem; background:rgba(247,242,228,.6); color:var(--ink); outline:none; width:100%;
}
#letter-sign::placeholder{color:rgba(58,40,28,.4)}
.letter-decor{position:absolute; right:.9rem; bottom:6.2rem; pointer-events:none; opacity:.5; transform:rotate(8deg)}
.letter-decor .seal{
  display:flex; width:2.6rem; height:2.6rem; border:2px solid var(--seal); color:var(--seal);
  border-radius:.35rem; font-family:var(--font-display); font-weight:bold; font-size:.7rem;
  align-items:center; justify-content:center; line-height:1.25; letter-spacing:.04em; text-align:center;
}

/* ============ 鍥炰俊椤?============ */
.reply-paper{
  background:
    radial-gradient(260px 120px at 85% 0%, rgba(232,201,122,.14), transparent 70%),
    var(--paper);
  border-radius:.9rem; border:1px solid var(--gold-dim); padding:1.1rem 1rem 1.2rem;
  box-shadow:0 8px 22px rgba(0,0,0,.35); flex:1; display:flex; flex-direction:column;
}
.reply-paper h2{font-family:var(--font-display); color:var(--bg-deep); font-size:1.4rem; text-align:center; letter-spacing:.1em}
.reply-paper .reply-sub{text-align:center; font-size:.78rem; color:rgba(58,40,28,.65); margin:.3rem 0 .8rem; font-family:var(--font-display)}
.reply-body{
  flex:1; overflow-y:auto; white-space:pre-wrap; word-break:break-word; line-height:1.95; font-size:.98rem;
  color:var(--ink); padding:.4rem .3rem; -webkit-overflow-scrolling:touch;
}
.reply-body::-webkit-scrollbar{width:4px}
.reply-body::-webkit-scrollbar-thumb{background:var(--gold-dim); border-radius:2px}
.cursor{display:inline-block; width:.16rem; height:1.05em; background:var(--bg-deep); vertical-align:-.15em; margin-left:.05rem; animation:blink 1s steps(1) infinite}
.reply-stamp{
  margin:0 auto; width:3rem; height:3rem; border:2px solid var(--seal); color:var(--seal);
  border-radius:.35rem; font-family:var(--font-display); font-weight:bold; font-size:.8rem;
  display:flex; align-items:center; justify-content:center; transform:rotate(-9deg);
  opacity:0; transition:opacity .8s ease; letter-spacing:.05em;
}
.reply-stamp.show{opacity:.85}
.reply-actions{display:flex; gap:.6rem; margin-top:.9rem}
.reply-actions .btn{flex:1}

/* ============ 绾康鍗￠〉 ============ */
.card-stage{flex:1; display:flex; align-items:center; justify-content:center; padding:.4rem 0}
#card-canvas{width:100%; max-width:21rem; border-radius:.7rem; box-shadow:0 10px 26px rgba(0,0,0,.45); background:#5c0e0e}
.card-actions{display:flex; gap:.6rem; margin-top:.9rem}
.card-actions .btn{flex:1}

/* ============ 璇︽儏寮瑰眰 ============ */
.modal{position:fixed; inset:0; z-index:60; display:none; align-items:flex-end; justify-content:center}
.modal.open{display:flex}
.modal-mask{position:absolute; inset:0; background:rgba(20,8,6,.72); backdrop-filter:blur(2px)}
.modal-card{
  position:relative; width:100%; max-width:520px; max-height:88vh; overflow-y:auto; border-radius:1.1rem 1.1rem 0 0;
  background:var(--paper); padding:1.1rem 1rem 1.3rem; animation:sheetUp .35s ease both;
  -webkit-overflow-scrolling:touch;
}
@keyframes sheetUp{from{transform:translateY(40px); opacity:.4} to{transform:none; opacity:1}}
.modal-head{display:flex; align-items:center; gap:.8rem}
.modal-head .hero-avatar{width:4rem; height:4rem}
.modal-name{font-family:var(--font-display); font-size:1.5rem; color:var(--bg-deep)}
.modal-years{font-size:.85rem; color:rgba(58,40,28,.7); margin-top:.1rem}
.modal-tags{margin-top:.35rem; display:flex; flex-wrap:wrap; gap:.3rem}
.modal-tags span{font-size:.7rem; border:1px solid var(--gold-dim); border-radius:2rem; padding:.06rem .45rem; color:var(--brown); background:rgba(200,160,96,.14)}
.modal-quote{margin:.7rem 0; font-family:var(--font-display); font-size:.95rem; line-height:1.7; color:rgba(58,40,28,.92); border-left:2px solid var(--gold); padding-left:.6rem}
.modal-relations{margin:.6rem 0}
.rel-item{display:flex; justify-content:space-between; font-size:.82rem; padding:.3rem .1rem; border-bottom:1px dashed rgba(200,160,96,.35); color:rgba(58,40,28,.85)}
.rel-item b{color:var(--bg-deep); font-weight:600}
.rel-item .rel-note{color:rgba(58,40,28,.55); font-size:.74rem; margin-top:.05rem; display:block}
.modal-actions{display:flex; gap:.6rem; margin-top:1rem}
.modal-actions .btn{flex:1}

/* ============ Toast ============ */
#toast{
  position:fixed; left:50%; bottom:12%; transform:translate(-50%, 12px); z-index:99;
  background:rgba(30,14,10,.92); color:var(--gold-hi); border:1px solid var(--gold-dim);
  padding:.6rem 1.1rem; border-radius:2rem; font-size:.86rem; max-width:82%; text-align:center;
  opacity:0; pointer-events:none; transition:opacity .3s ease, transform .3s ease;
}
#toast.show{opacity:1; transform:translate(-50%, 0)}

/* ============ 寰俊/绉诲姩绔粏鑺?============ */
input,textarea,button{font-family:var(--font-body)}
@media (max-width:380px){
  .poster-title{font-size:2.4rem}
  .hero-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<canvas id="particles"></canvas>
<div class="paper-fiber"></div>

<div class="app" id="app">

  <!-- ================= 棣栭〉锛氫笁鎵嬫満鏍锋満涓昏瑙?================= -->
  <section class="screen active" id="screen-home">
    <div class="home-hero">
      <h1 class="poster-title">鏄熺伀鍥炰俊</h1>
      <p class="poster-sub">璺ㄨ秺鏃剁┖鐨勫璇?/p>
      <span class="home-seal">鏄熺伀<br>鍥炰俊</span>
    </div>

    <div class="phone-stack">
      <!-- 01 鍐欎俊鏍锋満 -->
      <div class="phone phone-side top" data-goto="heroes">

        <div class="phone-notch"></div>
        <div class="phone-screen">
          <div class="mock-letter">
            <span class="mock-title">鑷?鏉庡ぇ閽?鍏堢敓</span>
            <span class="mock-line"></span>
            <span class="mock-line"></span>

            <span class="mock-btn">瀵勫嚭杩欏皝淇?/span>
          </div>
          <span class="mock-seal">鏄熺伀</span>
        </div>
      </div>
      <!-- 02 鍥炰俊鏍锋満锛堜富瑙嗚灞呬腑锛?-->
      <div class="phone phone-main" data-goto="heroes">
        <span class="mock-num">02 鍥炰俊</span>
        <div class="phone-notch"></div>
        <div class="phone-screen">
          <div class="mock-reply">
            <span class="mock-reply-title">鏉庡ぇ閽?鐨勫洖淇?/span>
            <p class="mock-text">闈掑勾璇稿悰锛氫綘鐨勬潵淇℃垜璇昏繃浜嗐€傞潚鏄ヤ箣浜猴紝褰撴湁闈掓槬涔嬬簿绁炩€︹€?/p>
            <span class="mock-cursor"></span>
          </div>
          <span class="mock-seal">鍥炰俊</span>
        </div>
      </div>
      <!-- 03 绾康鍗℃牱鏈?-->
      <div class="phone phone-side bot" data-goto="heroes">
        <span class="mock-num">03 绾康鍗?/span>
        <div class="phone-notch"></div>
        <div class="phone-screen">
          <div class="mock-card-body">
            <span class="mock-card-avatar">鏉?/span>
            <b>鏉庡ぇ閽?/b>
            <i>1889鈥?927</i>
            <span class="mock-seal">鏄熺伀鍥炰俊</span>
          </div>
        </div>
      </div>
    </div>
    <p class="home-hint">鐐瑰嚮鏍锋満锛屾彁绗斿啓淇＄粰蹇冧腑鐨勫厛杈?/p>

    <div class="ink-mountain">
      <svg viewBox="0 0 300 90" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax meet">
        <path d="M0 90 L0 62 Q38 40 78 58 Q110 34 150 52 Q192 28 228 46 Q268 36 300 52 L300 90 Z" fill="rgba(0,0,0,.28)"/>
        <path d="M0 90 L0 74 Q46 58 96 72 Q150 56 210 70 Q266 62 300 74 L300 90 Z" fill="rgba(0,0,0,.2)"/>
        <path d="M120 58 Q140 30 168 30 Q196 30 214 54 Q196 44 168 46 Q142 46 120 58 Z" fill="rgba(232,201,122,.16)"/>
      </svg>
    </div>
  </section>

  <!-- ================= 鍏堣緢閫夋嫨椤?================= -->
  <section class="screen" id="screen-heroes">
    <header class="screen-head">
      <button type="button" class="back-btn" data-goto="home">鈥?/button>
      <h2>閫夋嫨涓€浣嶅厛杈?/h2>

function pickQuote(letter, topicCfg){
  var text = (letter || "").trim();
  if (!text) return "";
  var label = topicCfg && topicCfg.label ? topicCfg.label : "";
  if (label && text === label) return "";
  text = text.replace(/\s+/g, " ").replace(/^[锛屻€傦紒锛燂紱锛氥€乗t\r\n]+|[锛屻€傦紒锛燂紱锛氥€乗t\r\n]+$/g, "");
  if (!text) return "";
  var m = text.match(/^.*?[銆傦紒锛焆/);
  var first = m ? m[0] : text;
  if (first.length > 40) first = first.slice(0, 40);
  return first.replace(/[锛屻€傦紒锛焆+$/, "");
}
function buildOfflineReply(hero, topicKey, letter, signature){

  var topicCfg = (hero.topics && hero.topics[topicKey]) || (hero.topics && hero.topics.my_ideal) || {};
  var quote = pickQuote(letter, topicCfg);
  var body = OFFLINE_REPLY[hero.id] || "";
  if (!body){
    var bio = hero.biography || {};
    var core = (bio.legacy || bio.sacrifice || hero.bio || "").trim() || (hero.name + "涓€鐢熻拷瀵荤湡鐞嗐€佷互韬鍥斤紝鎶婄儹琛€涓庨潚鏄ョ尞缁欎簡鑴氫笅鐨勫湡鍦般€?);
    body = "鏈嬪弸锛岃瀛楀闈€? + core + "鎰夸綘鐝嶆儨浠婃棩鏉ヤ箣涓嶆槗鐨勫厜鏄庯紝鎶婂厛杈堟湭绔熺殑浜嬩笟涓€浠ｄ竴浠ｄ紶涓嬪幓銆?;
  }
  var m = body.match(/^(.*?[銆傦紒锛焆)([\s\S]*)$/);
  if (m && m[2] && m[2].trim()){
    var rest = quote ? hook + "浣犲湪淇′腑鍐欓亾銆? + quote + "銆嶁€斺€? + m[2].trim() : hook + m[2].trim();
    body = m[1].trim() + "\n\n" + rest;
  } else {
    body = quote ? hook + "浣犲湪淇′腑鍐欓亾銆? + quote + "銆嶃€俓n" + body : hook + "\n" + body;
  }
  var sig = (signature || "").trim() || "涓€涓綋浠ｉ潚骞?;

/* ---------- 绾康鍗?Canvas 缁樺埗 ---------- */
function wrapText(ctx, text, cx, startY, maxW, lineH){
  var chars = String(text).split(""), line = "", y = startY;
  for (var i = 0; i < chars.length; i++){
    var t = line + chars[i];
    if (ctx.measureText(t).width > maxW && line){ ctx.fillText(line, cx, y); line = chars[i]; y += lineH; }
    else line = t;
  }
  if (line) ctx.fillText(line, cx, y);
  return y + lineH;
}

/* ---------- 鏄熺伀绮掑瓙锛堝眰绾ф渶浣庛€佷笉鎷︽埅鐐瑰嚮锛?---------- */
var Particles = (function(){
  var canvas = $("particles"), ctx = canvas.getContext("2d"), w = 0, h = 0;
  var list = [], COUNT = 32;
  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  function spawn(){
    return {
      x: Math.random()*w, y: Math.random()*h,
      r: 0.6 + Math.random()*1.4,
      vx: (Math.random()-0.5)*0.22,
      vy: -(0.05 + Math.random()*0.18),
      a: 0.14 + Math.random()*0.30,
      da: 0.004 + Math.random()*0.006,
      ph: Math.random()*Math.PI*2,
      gold: Math.random() < 0.75
    };
  }
  function init(){
    resize();
    list = [];
    for (var i = 0; i < COUNT; i++) list.push(spawn());
    window.addEventListener("resize", function(){ resize(); });
    tick();
  }
  function tick(){
    ctx.clearRect(0, 0, w, h);
    for (var i = 0; i < list.length; i++){
      var p = list[i];
      p.x += p.vx; p.y += p.vy;
      p.ph += p.da;
      if (p.y < -8){ p.y = h + 8; p.x = Math.random()*w; }
      if (p.x < -8) p.x = w + 8; else if (p.x > w + 8) p.x = -8;
      var alpha = p.a * (0.6 + 0.4*Math.sin(p.ph));
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = p.gold ? "rgba(232,201,122," + alpha + ")" : "rgba(201,160,80," + (alpha*0.8) + ")";
      ctx.fill();
      /* 寰急鏄熻姃 */
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r*2.6, 0, Math.PI*2);
      ctx.fillStyle = p.gold ? "rgba(232,201,122," + (alpha*0.18) + ")" : "rgba(201,160,80," + (alpha*0.14) + ")";
      ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  return { init: init };
})();
